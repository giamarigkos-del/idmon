<!DOCTYPE html>
<html lang="en" data-i18n-doctitle="landingDocTitle">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operations Portal — Welcome</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/shared.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .landing-box{max-width:420px;width:100%;text-align:center;}
  .landing-box h1{font-size:22px;margin:0 0 8px;}
  .landing-box p{font-size:14px;color:var(--text-soft);line-height:1.6;margin:0 0 32px;}
  .choice-grid{display:flex;flex-direction:column;gap:12px;}
  .choice-btn{display:block;width:100%;text-align:left;background:var(--surface);
    border:1px solid var(--border);border-radius:10px;padding:18px 20px;cursor:pointer;
    font-family:inherit;color:var(--text);transition:border-color .15s;}
  .choice-btn:hover{border-color:var(--accent);}
  .choice-btn .choice-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .choice-btn .choice-desc{font-size:12.5px;color:var(--text-soft);line-height:1.5;}

  .dev-form{display:none;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:18px 20px;text-align:left;margin-top:4px;}
  .dev-form.show{display:block;}
  .dev-form label{font-size:12px;color:var(--text-soft);display:block;margin-bottom:6px;}
  .dev-form input{width:100%;border:1px solid var(--border);border-radius:6px;
    padding:9px 10px;font-size:13.5px;background:var(--bg);color:var(--text);}
  .dev-form-actions{display:flex;gap:8px;margin-top:10px;}
  .dev-form button{border:none;border-radius:6px;padding:9px 16px;font-size:13px;
    cursor:pointer;font-weight:600;font-family:inherit;}
  .dev-form .submit-btn{background:var(--accent);color:var(--on-accent);}
  .dev-form .cancel-btn{background:none;border:1px solid var(--border);color:var(--text);}
  .dev-error{font-size:12.5px;color:var(--danger);margin-top:10px;display:none;}
  .dev-error.show{display:block;}

  /* Section H: tabs Sign up / Log in μέσα στο account-form -- ίδια χρωματική
     λογική με το lang-toggle (ενεργό tab = accent background). */
  .account-tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:6px;padding:2px;margin-bottom:16px;}
  .account-tabs button{flex:1;border:none;background:none;color:var(--text-soft);font-size:12.5px;
    font-weight:700;padding:7px 0;border-radius:4px;cursor:pointer;font-family:inherit;}
  .account-tabs button.active{background:var(--accent);color:var(--on-accent);}

  .forgot-link{display:block;text-align:right;font-size:11.5px;color:var(--text-soft);
    text-decoration:none;margin-top:8px;}
  .forgot-link:hover{color:var(--accent);text-decoration:underline;}

  .forgot-success{font-size:12.5px;color:var(--text-soft);line-height:1.5;
    background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    padding:12px 14px;display:none;}
  .forgot-success.show{display:block;}

  .legal-footer{margin-top:24px;font-size:11.5px;color:var(--text-soft);}
  .legal-footer a{color:var(--text-soft);text-decoration:underline;}
  .legal-footer a:hover{color:var(--accent);}

  /* Ίδιο .back-link στυλ με article.html/editor.html, αλλά fixed πάνω-
     αριστερά (συμμετρικό με το ήδη υπάρχον lang-toggle-fixed δεξιά) --
     αυτή η σελίδα δεν έχει top-bar, οπότε δεν υπάρχει έτοιμο container. */
  .back-link-fixed{position:fixed;top:16px;left:16px;font-size:11.5px;font-weight:700;
    color:var(--text);text-decoration:none;background:var(--surface-2);
    border:1px solid var(--border);border-radius:4px;padding:5px 10px;z-index:10;}
  .back-link-fixed:hover{background:var(--accent-soft);border-color:var(--accent);}
</style>
</head>
<body>
  <a class="back-link-fixed" href="/">←Portal</a>
  <div class="lang-toggle lang-toggle-fixed" id="langToggle">
    <button type="button" class="lang-btn" data-lang="en">EN</button>
    <button type="button" class="lang-btn" data-lang="el">GR</button>
  </div>

  <div class="landing-box">
    <h1>Operations Portal</h1>
    <p data-i18n="landingIntro">Before you continue, choose how you'll enter.</p>

    <div class="choice-grid" id="choiceGrid">
      <button type="button" class="choice-btn" id="guestBtn">
        <div class="choice-title" data-i18n="guestTitle">Guest</div>
        <div class="choice-desc" data-i18n="guestDesc">Freely try the tool in your own separate space. Nobody else sees what you upload, and it's automatically deleted after 7 days.</div>
      </button>
      <button type="button" class="choice-btn" id="accountBtn">
        <div class="choice-title" data-i18n="accountTitle">Account</div>
        <div class="choice-desc" data-i18n="accountDesc">Sign up or log in to your own permanent workspace, from any device.</div>
      </button>
    </div>

    <div class="dev-form" id="accountForm">
      <div class="account-tabs">
        <button type="button" class="active" id="signupTabBtn" data-i18n="signupTab">Sign up</button>
        <button type="button" id="loginTabBtn" data-i18n="loginTab">Log in</button>
      </div>
      <label for="accountEmail" data-i18n="emailLabel">Email</label>
      <input type="email" id="accountEmail" placeholder="you@example.com" autocomplete="email">
      <label for="accountPassword" style="margin-top:10px;" data-i18n="passwordLabel">Password</label>
      <input type="password" id="accountPassword" placeholder="••••••••" autocomplete="current-password">
      <a href="#" class="forgot-link" id="forgotLink" data-i18n="forgotLink" style="display:none;">Forgot password?</a>
      <div class="dev-form-actions">
        <button type="button" class="submit-btn" id="accountSubmitBtn" data-i18n="signupBtn">Sign up</button>
        <button type="button" class="cancel-btn" id="accountCancelBtn" data-i18n="cancel">Cancel</button>
      </div>
      <div class="dev-error" id="accountError"></div>
    </div>

    <div class="dev-form" id="forgotForm">
      <label for="forgotEmail" data-i18n="emailLabel">Email</label>
      <input type="email" id="forgotEmail" placeholder="you@example.com" autocomplete="email">
      <div class="dev-form-actions">
        <button type="button" class="submit-btn" id="forgotSubmitBtn" data-i18n="sendResetLink">Send reset link</button>
        <button type="button" class="cancel-btn" id="forgotCancelBtn" data-i18n="cancel">Cancel</button>
      </div>
      <div class="forgot-success" id="forgotSuccess" data-i18n="forgotSuccessMessage">If that email is registered, a reset link has been sent.</div>
      <div class="dev-error" id="forgotError"></div>
    </div>

    <div class="dev-form" id="resetForm">
      <label for="resetNewPassword" data-i18n="newPasswordLabel">New password</label>
      <input type="password" id="resetNewPassword" placeholder="••••••••" autocomplete="new-password">
      <label for="resetConfirmPassword" style="margin-top:10px;" data-i18n="confirmPasswordLabel">Confirm new password</label>
      <input type="password" id="resetConfirmPassword" placeholder="••••••••" autocomplete="new-password">
      <div class="dev-form-actions">
        <button type="button" class="submit-btn" id="resetSubmitBtn" data-i18n="setNewPasswordBtn">Set new password</button>
      </div>
      <div class="dev-error" id="resetError"></div>
    </div>

    <div class="dev-form" id="devForm">
      <label for="devPassword" data-i18n="devPasswordLabel">Developer password</label>
      <input type="password" id="devPassword" placeholder="••••••••" autocomplete="current-password">
      <div class="dev-form-actions">
        <button type="button" class="submit-btn" id="devSubmitBtn" data-i18n="login">Log in</button>
        <button type="button" class="cancel-btn" id="devCancelBtn" data-i18n="cancel">Cancel</button>
      </div>
      <div class="dev-error" id="devError" data-i18n="wrongPassword">Wrong password.</div>
    </div>

    <div class="legal-footer">
      <a href="/terms.html" data-i18n="termsLink">Terms of Service</a> · <a href="/privacy.html" data-i18n="privacyLink">Privacy Policy</a>
    </div>
  </div>

<script>window.__IS_LANDING_PAGE__ = true;</script>
<script src="/shared.js"></script>
<script>
  const el = (id) => document.getElementById(id);

  applyTranslations();
  initLangToggle("langToggle");

  // Το "←Portal" έχει νόημα ΜΟΝΟ αν υπάρχει ήδη αποθηκευμένο workspace --
  // αλλιώς το "/" θα έστελνε τον χρήστη πάλι εδώ (index.html δεν βρίσκει
  // workspaceId, redirect πίσω στο landing). Χωρίς αποθηκευμένο workspace
  // (π.χ. αμέσως μετά από "Αλλαγή λειτουργίας"), το κουμπί κρύβεται.
  if (!localStorage.getItem("workspaceId")) {
    document.querySelector(".back-link-fixed").style.display = "none";
  }

  el("guestBtn").addEventListener("click", () => {
    // Νέο, τυχαίο, απομονωμένο workspace -- κανείς άλλος δεν το βλέπει.
    const id = crypto.randomUUID();
    localStorage.setItem("workspaceId", id);
    window.location.href = "/";
  });

  // Section O: το "Developer" δεν είναι πια ορατή επιλογή στο δημόσιο
  // landing (μόνο Account/Guest είναι δημόσια) -- η πρόσβαση γίνεται ΜΟΝΟ
  // μέσω κρυφού URL (?developer=1), που ξέρει μόνο ο ίδιος ο διαχειριστής.
  // Ήδη προστατευμένο και από rate limiting στο /developer-login backend.
  function showDevForm() {
    el("choiceGrid").style.display = "none";
    el("devForm").classList.add("show");
    el("devPassword").focus();
  }

  if (new URLSearchParams(window.location.search).get("developer")) {
    showDevForm();
  }

  el("devCancelBtn").addEventListener("click", () => {
    el("devForm").classList.remove("show");
    el("choiceGrid").style.display = "flex";
    el("devError").classList.remove("show");
    el("devPassword").value = "";
  });

  async function submitDevLogin() {
    const password = el("devPassword").value;
    const btn = el("devSubmitBtn");
    const errorEl = el("devError");
    errorEl.classList.remove("show");
    btn.disabled = true;
    btn.textContent = t("checking");
    try {
      const res = await fetch("/developer-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        errorEl.textContent = t("wrongPassword");
        errorEl.classList.add("show");
        btn.disabled = false;
        btn.textContent = t("login");
        return;
      }
      localStorage.setItem("workspaceId", data.workspaceId);
      window.location.href = "/";
    } catch (err) {
      errorEl.textContent = t("connectionErrorPrefix") + err.message;
      errorEl.classList.add("show");
      btn.disabled = false;
      btn.textContent = t("login");
    }
  }

  el("devSubmitBtn").addEventListener("click", submitDevLogin);
  el("devPassword").addEventListener("keydown", (e) => {
    if (e.key === "Enter") submitDevLogin();
  });

  // Section H: λογαριασμοί πελατών -- ίδιο pattern με τη φόρμα Developer,
  // απλά με δύο tabs (sign up / log in) που καλούν διαφορετικό endpoint.
  let accountMode = "signup";

  function setAccountMode(mode) {
    accountMode = mode;
    el("signupTabBtn").classList.toggle("active", mode === "signup");
    el("loginTabBtn").classList.toggle("active", mode === "login");
    el("accountSubmitBtn").textContent = mode === "signup" ? t("signupBtn") : t("login");
    el("forgotLink").style.display = mode === "login" ? "block" : "none";
    el("accountError").classList.remove("show");
  }

  el("accountBtn").addEventListener("click", () => {
    el("choiceGrid").style.display = "none";
    el("accountForm").classList.add("show");
    el("accountEmail").focus();
  });

  el("accountCancelBtn").addEventListener("click", () => {
    el("accountForm").classList.remove("show");
    el("choiceGrid").style.display = "flex";
    el("accountError").classList.remove("show");
    el("accountEmail").value = "";
    el("accountPassword").value = "";
  });

  el("signupTabBtn").addEventListener("click", () => setAccountMode("signup"));
  el("loginTabBtn").addEventListener("click", () => setAccountMode("login"));

  async function submitAccountForm() {
    const email = el("accountEmail").value.trim();
    const password = el("accountPassword").value;
    const btn = el("accountSubmitBtn");
    const errorEl = el("accountError");
    errorEl.classList.remove("show");
    btn.disabled = true;
    btn.textContent = t("checking");

    const endpoint = accountMode === "signup" ? "/account/signup" : "/account/login";

    try {
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        errorEl.textContent = data.error || t("connectionErrorPrefix");
        errorEl.classList.add("show");
        btn.disabled = false;
        btn.textContent = accountMode === "signup" ? t("signupBtn") : t("login");
        return;
      }
      localStorage.setItem("workspaceId", data.workspaceId);
      localStorage.setItem("sessionToken", data.sessionToken);
      window.location.href = "/";
    } catch (err) {
      errorEl.textContent = t("connectionErrorPrefix") + err.message;
      errorEl.classList.add("show");
      btn.disabled = false;
      btn.textContent = accountMode === "signup" ? t("signupBtn") : t("login");
    }
  }

  el("accountSubmitBtn").addEventListener("click", submitAccountForm);
  el("accountPassword").addEventListener("keydown", (e) => {
    if (e.key === "Enter") submitAccountForm();
  });

  // Section O: "Ξέχασα τον κωδικό" -- ξεχωριστή μικρή φόρμα (μόνο email),
  // ΠΑΝΤΑ το ίδιο γενικό μήνυμα στο τέλος, ό,τι κι αν γράψει ο χρήστης --
  // το backend δεν αποκαλύπτει αν το email υπάρχει.
  el("forgotLink").addEventListener("click", (e) => {
    e.preventDefault();
    el("accountForm").classList.remove("show");
    el("forgotForm").classList.add("show");
    el("forgotSuccess").classList.remove("show");
    el("forgotError").classList.remove("show");
    el("forgotEmail").focus();
  });

  el("forgotCancelBtn").addEventListener("click", () => {
    el("forgotForm").classList.remove("show");
    el("accountForm").classList.add("show");
    el("forgotEmail").value = "";
  });

  async function submitForgotPassword() {
    const email = el("forgotEmail").value.trim();
    const btn = el("forgotSubmitBtn");
    const errorEl = el("forgotError");
    errorEl.classList.remove("show");
    el("forgotSuccess").classList.remove("show");
    btn.disabled = true;
    btn.textContent = t("checking");
    try {
      const res = await fetch("/account/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      btn.disabled = false;
      btn.textContent = t("sendResetLink");
      if (!res.ok) {
        errorEl.textContent = data.error || t("connectionErrorPrefix");
        errorEl.classList.add("show");
        return;
      }
      el("forgotSuccess").classList.add("show");
      el("forgotEmail").value = "";
    } catch (err) {
      errorEl.textContent = t("connectionErrorPrefix") + err.message;
      errorEl.classList.add("show");
      btn.disabled = false;
      btn.textContent = t("sendResetLink");
    }
  }

  el("forgotSubmitBtn").addEventListener("click", submitForgotPassword);
  el("forgotEmail").addEventListener("keydown", (e) => {
    if (e.key === "Enter") submitForgotPassword();
  });

  // Section O: αν το URL έχει ?resetToken=..., ο χρήστης μόλις πάτησε τον
  // σύνδεσμο από το email -- δείξε ΜΟΝΟ τη φόρμα "νέος κωδικός", κρύψε τα
  // πάντα άλλα (δεν έχει νόημα να ξαναδιαλέξει Developer/Guest/Account εδώ).
  const resetToken = new URLSearchParams(window.location.search).get("resetToken");
  if (resetToken) {
    el("choiceGrid").style.display = "none";
    el("resetForm").classList.add("show");
  }

  async function submitResetPassword() {
    const newPassword = el("resetNewPassword").value;
    const confirmPassword = el("resetConfirmPassword").value;
    const btn = el("resetSubmitBtn");
    const errorEl = el("resetError");
    errorEl.classList.remove("show");

    if (newPassword.length < 8) {
      errorEl.textContent = t("passwordTooShort");
      errorEl.classList.add("show");
      return;
    }
    if (newPassword !== confirmPassword) {
      errorEl.textContent = t("passwordsDontMatch");
      errorEl.classList.add("show");
      return;
    }

    btn.disabled = true;
    btn.textContent = t("checking");
    try {
      const res = await fetch("/account/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: resetToken, newPassword }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        errorEl.textContent = data.error || t("connectionErrorPrefix");
        errorEl.classList.add("show");
        btn.disabled = false;
        btn.textContent = t("setNewPasswordBtn");
        return;
      }
      localStorage.setItem("workspaceId", data.workspaceId);
      localStorage.setItem("sessionToken", data.sessionToken);
      window.location.href = "/";
    } catch (err) {
      errorEl.textContent = t("connectionErrorPrefix") + err.message;
      errorEl.classList.add("show");
      btn.disabled = false;
      btn.textContent = t("setNewPasswordBtn");
    }
  }

  el("resetSubmitBtn").addEventListener("click", submitResetPassword);
  el("resetConfirmPassword").addEventListener("keydown", (e) => {
    if (e.key === "Enter") submitResetPassword();
  });
</script>
</body>
</html>
