name = "operations-portal-rag"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Custom domains -- αυτόματα φτιάχνουν DNS record + SSL πιστοποιητικό σε κάθε
# `wrangler deploy`, δεν χρειάζεται καμία χειροκίνητη ρύθμιση στο dashboard.
# ΑΠΟΦΑΣΗ (23 Σεπτ. 2026): ολόκληρο το προϊόν ζει στο idmon.app (marketing
# σελίδα στο /, εφαρμογή στο /home.html, /landing.html, /editor.html...).
# Το app.idmon.app μένει ΜΟΝΟ ώστε να υπάρχει DNS record για το Cloudflare
# Redirect Rule που στέλνει μόνιμα (301) κάθε app.idmon.app/... στο
# idmon.app/... -- κανένα παλιό link δεν σπάει.
#
# workers_dev = false ΣΚΟΠΙΜΑ (απόφαση, όχι απλά το default του Wrangler).
# Το παλιό *.workers.dev URL έχει ήδη απενεργοποιηθεί.
workers_dev = false
routes = [
  { pattern = "idmon.app", custom_domain = true },
  { pattern = "app.idmon.app", custom_domain = true }
]

[[vectorize]]
binding = "VECTORIZE"
index_name = "operations-portal-rag-index"
# Το τοπικό wrangler dev δεν υποστηρίζει καθόλου Vectorize emulation --
# χωρίς αυτό, κάθε publish/delete εγγράφου σκάει τοπικά. Με remote = true,
# το τοπικό dev μιλάει με το ΠΡΑΓΜΑΤΙΚΟ production index -- πρόσεξε: τα
# test έγγραφα που δημοσιεύεις τοπικά μπαίνουν πραγματικά εκεί (γι' αυτό
# όλα τα tests χρησιμοποιούν πάντα τυχαία/ξεχωριστά documentId, δεν
# πειράζουν ποτέ πραγματικό περιεχόμενο).
remote = true

[[kv_namespaces]]
binding = "DOCUMENT_REGISTRY"
id = "e6ea2213cca7424b988d24d5307ee1ca"

[[d1_databases]]
binding = "DB"
database_name = "rag-demo-tool-accounts"
database_id = "240959e8-e3b3-48e5-937e-846f109454ca"

[assets]
directory = "./public"
not_found_handling = "none"

[vars]
# Το "from" address για τα email ειδοποιήσεων (Section G). Πρέπει να είναι σε
# domain που έχεις επαληθεύσει στο Resend (https://resend.com/domains).
# Το ίδιο το API key ΔΕΝ μπαίνει εδώ -- είναι secret:
#   wrangler secret put RESEND_API_KEY
NOTIFY_FROM_EMAIL = "notifications@idmon.app"

# --- Google Drive OAuth connector ---
# Το Client Secret ΔΕΝ μπαίνει εδώ -- είναι secret:
#   wrangler secret put GOOGLE_CLIENT_SECRET
GOOGLE_CLIENT_ID = "532047777604-98qlf4jfdp3kic0i7ko7pniteo89gaau.apps.googleusercontent.com"
GOOGLE_REDIRECT_URI = "https://idmon.app/oauth/google/callback"

# --- Paddle billing (Section R) ---
# Το webhook secret ΔΕΝ μπαίνει εδώ -- είναι secret:
#   wrangler secret put PADDLE_WEBHOOK_SECRET
# Τα price IDs δεν είναι μυστικά. Αυτά είναι τα Paddle LIVE prices.
PADDLE_PRICE_BASIC = "pri_01m2ynemr2t4dnes8rz775p090"
PADDLE_PRICE_PRO = "pri_01m2ynen6sh5949wn1pnsr1s51"
PADDLE_PRICE_BASIC_MONTHLY = "pri_01m2ynemr2t4dnes8rz775p090"
PADDLE_PRICE_BASIC_ANNUAL = "pri_01m2ynemzv76wbb37zvr1q9fnb"
PADDLE_PRICE_PRO_MONTHLY = "pri_01m2ynen6sh5949wn1pnsr1s51"
PADDLE_PRICE_PRO_ANNUAL = "pri_01m2ynend8w7383t0nqzgd0f1z"

# Checkout στο editor.html: ο server στέλνει αυτά τα δύο στον browser μαζί με
# τα price IDs (GET /usage/status, πεδίο "upgrade"). Το client-side token είναι
# ΔΗΜΟΣΙΟ by design (το χρησιμοποιεί το Paddle.js στον browser) -- δεν είναι
# secret. Είναι ξεχωριστό ανά περιβάλλον (sandbox / live). Για live checkout
# χρειάζεται Paddle LIVE client token.
# Αν λείπει κάποιο από τα δύο, το κουμπί "Αναβάθμιση" απλά δεν εμφανίζεται.
PADDLE_CLIENT_TOKEN = "live_d06ea77dbb7841c5652998a2c8e"
PADDLE_ENV = "production"

# --- Cloudflare Turnstile (Section R, auth hardening) ---
# Το SECRET key ΔΕΝ μπαίνει εδώ -- είναι secret:
#   wrangler secret put TURNSTILE_SECRET_KEY
# Το SITE key είναι δημόσιο by design (το χρησιμοποιεί το Turnstile widget
# στον browser) -- δεν είναι secret. Ξεχωριστό ανά περιβάλλον: αυτό εδώ
# είναι το πραγματικό, δηλωμένο μόνο για idmon.app. Το
# τοπικό .dev.vars έχει το δοκιμαστικό site key της Cloudflare αντί γι'
# αυτό (δουλεύει από οποιοδήποτε domain, π.χ. localhost).
TURNSTILE_SITE_KEY = "0x4AAAAAAE_gzTpIYxx2aETD"

# --- Cloudflare AI Gateway (Section R): fallback-ready path για τη
# Gemini μέσω gateway.ai.cloudflare.com αντί για απευθείας κλήση. Στάδιο
# Α: μόνο pass-through (ίδιο request/response σχήμα, καμία αλλαγή
# συμπεριφοράς). Το AI_GATEWAY_TOKEN (auth στο ίδιο το gateway, όχι στη
# Google) ΔΕΝ μπαίνει εδώ -- είναι secret:
#   wrangler secret put AI_GATEWAY_TOKEN
# Ούτε το CF_ACCOUNT_ID ούτε το AI_GATEWAY_ID είναι μυστικά -- και τα δύο
# εμφανίζονται ήδη δημόσια σε κάθε URL του gateway.
CF_ACCOUNT_ID = "12801f592f7e1b5fff2e7b2b4c661b90"
AI_GATEWAY_ID = "idmon-ai"