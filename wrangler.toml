name = "operations-portal-rag"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Custom domain -- αυτόματα φτιάχνει DNS record + SSL πιστοποιητικό σε κάθε
# `wrangler deploy`, δεν χρειάζεται καμία χειροκίνητη ρύθμιση στο dashboard.
# Το idmon.app (χωρίς "app.") μένει ελεύθερο για μελλοντική δημόσια σελίδα
# marketing/pricing, ξεχωριστή από το ίδιο το εργαλείο.
#
# workers_dev = false ΣΚΟΠΙΜΑ (απόφαση, όχι απλά το default του Wrangler) --
# μόνο ένα δημόσιο URL, το app.idmon.app. Το παλιό *.workers.dev URL έχει
# ήδη απενεργοποιηθεί.
workers_dev = false
routes = [
  { pattern = "app.idmon.app", custom_domain = true }
]

[[vectorize]]
binding = "VECTORIZE"
index_name = "operations-portal-rag-index"
# Το τοπικό wrangler dev δεν υποστηρίζει καθόλου Vectorize emulation --
# χωρίς αυτό, κάθε publish/delete εγγράφου σκάει τοπικά. Με remote = true,
# το τοπικό dev μιλάει με το ΠΡΑΓΜΑΤΙΚΟ production index -- πρόσεξε: τα
# test έγγραφα που δημοσιεύεις τοπικά μπαίνουν πραγματικά εκεί (γι' αυτό
# όλα τα tests χρησιμοποιούν πάντα τυχαία/ξεχωριστά documentId, δεν
# πειράζουν ποτέ πραγματικό περιεχόμενο).
remote = true

[[kv_namespaces]]
binding = "DOCUMENT_REGISTRY"
id = "e6ea2213cca7424b988d24d5307ee1ca"

[[d1_databases]]
binding = "DB"
database_name = "rag-demo-tool-accounts"
database_id = "240959e8-e3b3-48e5-937e-846f109454ca"

[assets]
directory = "./public"
not_found_handling = "none"

[vars]
# Το "from" address για τα email ειδοποιήσεων (Section G). Πρέπει να είναι σε
# domain που έχεις επαληθεύσει στο Resend (https://resend.com/domains).
# Το ίδιο το API key ΔΕΝ μπαίνει εδώ -- είναι secret:
#   wrangler secret put RESEND_API_KEY
NOTIFY_FROM_EMAIL = "notifications@idmon.app"

# --- Google Drive OAuth connector ---
# Το Client Secret ΔΕΝ μπαίνει εδώ -- είναι secret:
#   wrangler secret put GOOGLE_CLIENT_SECRET
GOOGLE_CLIENT_ID = "532047777604-98qlf4jfdp3kic0i7ko7pniteo89gaau.apps.googleusercontent.com"
GOOGLE_REDIRECT_URI = "https://app.idmon.app/oauth/google/callback"