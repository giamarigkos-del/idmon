<!DOCTYPE html>
<!-- public\team-admin.html -->
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Διαχείριση · Idmon για ομάδες</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="/team.css">
<style>
  /* Section W (30 Σεπ 2026): οθόνη διαχείρισης του admin ("Idmon για ομάδες"): τμήματα (και κρυφά),
     μέλη και ρόλοι, ιστορικό ενεργειών. Κάθε αλλαγή ισχύει αμέσως. Ο έλεγχος πρόσβασης γίνεται
     στον server, εδώ απλώς φαίνονται τα δεδομένα. Όλα μπαίνουν με textContent (ποτέ innerHTML).
     UX (1 Οκτ 2026): μήνυμα επιβεβαίωσης με ποιος, τι και ώρα (εξαφανίζεται σε 5 δευτερόλεπτα, τα
     σφάλματα μένουν μέχρι την επόμενη ενέργεια), επισήμανση της γραμμής που άλλαξε, επιβεβαίωση
     μέσα στη γραμμή μόνο για προαγωγή σε Admin και απενεργοποίηση μέλους, κλείδωμα της γραμμής
     όσο τρέχει το αίτημα.
     ΑΝΘΡΩΠΟΙ ΚΑΙ PROJECTS (1 Οκτ 2026): ο πίνακας "άνθρωποι × projects" με ένα select ανά project δεν κλιμακώνεται (200 πράκτορες και
     20 projects θα ήταν 4.000 dropdowns). Τώρα: λίστα ανθρώπων με αναζήτηση, φίλτρα, σελιδοποίηση και μαζικές ενέργειες (επιλογή πολλών),
     καρτέλα ατόμου για τον ρόλο οργανισμού και τα projects του, και σελίδα project με τα μέλη του και προσθήκη με επικόλληση emails. */
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--border);font-size:var(--fs-md);}
  .row .name{font-weight:600;} .row .meta{font-size:var(--fs-xs);color:var(--text-soft);}
  .proj-roles{display:flex;gap:10px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--text-soft);}
  form.add{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  form.add .grow{flex:1;min-width:200px;}
  .log{font-size:var(--fs-sm);line-height:1.5;}
  .log .a{font-weight:600;} .log .t{color:var(--text-soft);}
  .row{transition:background .6s ease;}
  .row.changed{background:var(--accent-soft);}
  .row.busy{opacity:.6;}
  .toast .x{padding:0 2px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 10px;}
  .toolbar input[type=text]{flex:1;min-width:180px;width:auto;}
  .bulkbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-radius:var(--r);background:var(--surface-2);font-size:var(--fs-sm);margin-bottom:8px;}
  .bulkbar.idle{color:var(--text-soft);}
  .bulkpanel{flex-basis:100%;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:8px;border-top:1px solid var(--border);}
  .listhead{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--text-soft);padding:6px 0;}
  .who{display:flex;align-items:center;gap:10px;min-width:0;}
  .av{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:var(--fs-xs);font-weight:600;flex:none;}
  .linkrow{background:none;border:none;color:var(--text);font-weight:600;font-size:var(--fs-md);cursor:pointer;padding:2px 0;font-family:inherit;text-align:left;}
  .linkrow:hover{text-decoration:underline;}
  .chips{display:inline-flex;gap:4px;flex-wrap:wrap;margin-top:3px;}
  .row.open{background:var(--surface-2);border-radius:var(--r);}
  .detail{margin-top:12px;background:var(--surface-2);}
  .detail:focus{outline:none;}
  .detail-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .prow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--border);font-size:var(--fs-md);}
  .seg{display:inline-flex;border:1px solid var(--field-border);border-radius:var(--r);overflow:hidden;}
  .seg button{border:none;background:var(--bg);color:var(--text-soft);padding:5px 12px;min-height:30px;font-size:var(--fs-sm);cursor:pointer;font-family:inherit;}
  .seg button:hover{color:var(--text);}
  .seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .pager{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:var(--fs-sm);color:var(--text-soft);}
  .pager .grow{flex:1;}
  .backlink{background:none;border:none;color:var(--text-soft);cursor:pointer;font-size:var(--fs-sm);padding:4px 0;font-family:inherit;margin-bottom:8px;}
  .backlink:hover{text-decoration:underline;color:var(--text);}
  .pastebox{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);}
  .group{margin-top:6px;}
  .group-body{margin:0 0 6px 10px;padding-left:14px;border-left:2px solid var(--border);}
  .group-title{font-weight:600;font-size:var(--fs-md);margin:18px 0 2px;}
  .client-row{border-top:1px solid var(--border);margin-top:10px;}
  .client-row .name{font-size:var(--fs-lg);}
  .client-row .pill{margin-left:8px;}
  select.move-client{max-width:230px;}
  .reading{margin-top:12px;}
  .reading details.audience{margin:0;background:var(--bg);}
  .reading-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--border);font-size:var(--fs-sm);}
  .reading-row:first-child{border-top:none;}
  .showdis{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--text-soft);margin:2px 0 4px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="notice-region" id="notice" aria-live="polite" aria-atomic="true"></div>

<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var me = null;
  var data = null; // overview
  // Η λέξη για το τμήμα: στο προφίλ «Εταιρεία» λέγεται «τμήμα», στο call center μένει «project».
  // Μορφές: s = ενικός, g = γενική ενικού, p = πληθυντικός, gp = γενική πληθυντικού, S/P = με κεφαλαίο.
  var WORDS = {
    company: { s: "τμήμα", g: "τμήματος", p: "τμήματα", gp: "τμημάτων", S: "Τμήμα", P: "Τμήματα" },
    multi_client: { s: "project", g: "project", p: "projects", gp: "projects", S: "Project", P: "Projects" }
  };
  function W() { return data && data.profile === "multi_client" ? WORDS.multi_client : WORDS.company; }
  var audit = null;
  var docsData = null;
  var tab = "departments";
  var region = document.getElementById("notice");
  var notice = null;        // {kind: "ok"|"err", text, count}: το μήνυμα που φαίνεται τώρα (ζει έξω από το #app, δεν χάνεται στις ανανεώσεις)
  var noticeTimer = null;
  var changedKey = null;    // η γραμμή που μόλις άλλαξε (data-key)
  var changedTimer = null;
  var NOTICE_MS = 5000;     // πόση ώρα μένει ένα μήνυμα επιβεβαίωσης
  var CHANGED_MS = 1000;    // πόση ώρα μένει επισημασμένη η γραμμή που άλλαξε

  function h(tag, props, children) {
    var node = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      if (k === "class") node.className = props[k];
      else if (k === "text") node.textContent = props[k];
      else if (k === "value") node.value = props[k];
      else if (k === "checked") node.checked = !!props[k];
      else if (k.slice(0, 2) === "on") node.addEventListener(k.slice(2), props[k]);
      else node.setAttribute(k, props[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return node;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function api(path, method, body) {
    var opts = { method: method || "GET", headers: {}, credentials: "same-origin" };
    if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    return fetch(path, opts).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (d) { return { status: res.status, data: d }; });
    }, function () {
      // Δεν υπάρχει σύνδεση: δεν σπάμε την αλυσίδα, ώστε κάθε γραμμή που κλειδώθηκε να ξεκλειδώνει πάντα.
      return { status: 0, data: { error: "network" } };
    });
  }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function clock() { var d = new Date(); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()); }

  // ---- μηνύματα: ΕΝΑ σημείο, σταθερή περιοχή aria-live έξω από το #app
  function paintNotice() {
    clear(region);
    if (!notice) return;
    var node = h("div", { class: "toast " + notice.kind, role: notice.kind === "err" ? "alert" : "status" }, [
      h("span", { class: "msg", text: notice.text + (notice.count > 1 ? " ×" + notice.count : "") }),
    ]);
    if (notice.kind === "err") node.appendChild(h("button", { class: "x", type: "button", "aria-label": "Κλείσιμο μηνύματος", text: "×", onclick: dismissNotice }));
    region.appendChild(node);
  }
  function dismissNotice() {
    if (noticeTimer) { clearTimeout(noticeTimer); noticeTimer = null; }
    notice = null;
    paintNotice();
  }
  function say(kind, text) {
    var again = !!notice && notice.kind === kind && notice.text === text;
    if (noticeTimer) { clearTimeout(noticeTimer); noticeTimer = null; }
    notice = { kind: kind, text: text, count: again ? notice.count + 1 : 1 };
    paintNotice(); // κάθε μήνυμα είναι ΝΕΟ στοιχείο, ώστε και μια επανάληψη να φαίνεται
    if (kind === "ok") noticeTimer = setTimeout(dismissNotice, NOTICE_MS);
  }
  function ok(text) { say("ok", text + " (" + clock() + ")"); }
  function fail(text) { say("err", text); }
  // Κάθε νέα ενέργεια του χρήστη ξεκινά από εδώ: ένα παλιό σφάλμα τελειώνει όταν γίνει κάτι άλλο.
  function beginAction() { if (notice && notice.kind === "err") dismissNotice(); }

  // ---- επισήμανση της γραμμής που άλλαξε
  function changed(key) { changedKey = key; }
  function flashRow() {
    if (!changedKey) return;
    var key = changedKey;
    changedKey = null;
    var row = Array.prototype.filter.call(app.querySelectorAll("[data-key]"), function (n) { return n.getAttribute("data-key") === key; })[0];
    if (!row) return;
    row.classList.add("changed");
    if (changedTimer) clearTimeout(changedTimer);
    changedTimer = setTimeout(function () { row.classList.remove("changed"); }, CHANGED_MS);
  }

  // ---- κλείδωμα γραμμής όσο τρέχει αίτημα, και επιβεβαίωση μέσα στη γραμμή
  function setDisabled(row, on) {
    Array.prototype.forEach.call(row.querySelectorAll("select, input, button"), function (c) { c.disabled = on; });
  }
  function lockRow(row, on) {
    row.classList.toggle("busy", on);
    row.setAttribute("aria-busy", on ? "true" : "false");
    setDisabled(row, on);
  }
  // Σβήνει τα υπόλοιπα χειριστήρια της γραμμής και ρωτά "Σίγουρα; Ναι / Όχι". Μόνο το "Ναι" εκτελεί.
  function confirmFirst(row, host, question, onYes, onNo) {
    if (row.querySelector(".confirm")) return;
    setDisabled(row, true);
    var box;
    function cancel() { box.parentNode && box.parentNode.removeChild(box); setDisabled(row, false); if (onNo) onNo(); }
    var no = h("button", { class: "btn secondary confirm-no", type: "button", text: "Όχι", onclick: cancel });
    var yes = h("button", { class: "btn danger confirm-yes", type: "button", text: "Ναι", onclick: function () {
      box.parentNode && box.parentNode.removeChild(box);
      onYes();
    } });
    box = h("span", { class: "confirm", role: "group", "aria-label": "Επιβεβαίωση" }, [h("span", { text: question }), yes, no]);
    box.addEventListener("keydown", function (e) { if (e.key === "Escape") cancel(); });
    host.appendChild(box);
    no.focus(); // ασφαλής προεπιλογή: το "Όχι"
  }
  var ERRORS = {
    invalid_name: "Το όνομα είναι κενό ή πολύ μεγάλο.", invalid_email: "Το email δεν είναι σωστό.",
    invalid_role: "Μη έγκυρος ρόλος.", email_in_use: "Αυτό το email χρησιμοποιείται ήδη.",
    last_admin: "Ο χώρος δεν μπορεί να μείνει χωρίς ενεργό admin. Όρισε πρώτα άλλον admin.", forbidden: "Δεν έχεις δικαίωμα.", not_found: "Δεν βρέθηκε.",
    network: "Δεν υπάρχει σύνδεση με τον server. Η αλλαγή δεν έγινε, δοκίμασε ξανά.",
    invalid_changes: "Η αλλαγή δεν είναι έγκυρη.",
    invalid_members: "Η επιλογή μελών δεν είναι έγκυρη.", invalid_emails: "Ένα από τα emails δεν είναι σωστό.",
    no_targets: "Δεν επιλέχθηκε κανένα μέλος.", too_many: "Πάρα πολλά μέλη σε ένα αίτημα. Το πολύ 100.",
    too_many_invites: "Για πάνω από 40 νέα μέλη δημιούργησέ τα χωρίς πρόσκληση.", invalid_status: "Η κατάσταση δεν είναι έγκυρη.",
    client_has_projects: "Ο πελάτης έχει ακόμα τμήματα. Μετέφερέ τα ή αφαίρεσέ τα πρώτα.",
    has_clients: "Υπάρχουν ακόμα πελάτες. Διέγραψέ τους πρώτα (αφού μεταφέρεις ή αφαιρέσεις τα τμήματά τους).",
    profile_company: "Αυτό ισχύει μόνο για χώρο call center. Άλλαξε πρώτα τον τύπο χώρου.",
    client_not_found: "Ο πελάτης δεν βρέθηκε (ίσως διαγράφηκε στο μεταξύ).", invalid_client: "Ο πελάτης δεν είναι έγκυρος.", invalid_profile: "Ο τύπος χώρου δεν είναι έγκυρος.",
    clients_unavailable: "Οι πελάτες δεν είναι ακόμα διαθέσιμοι σε αυτόν τον χώρο (λείπει μια ενημέρωση βάσης)."
  };
  function errText(r) {
    var e = r.data && r.data.error;
    var w = W();
    // Η μεταφορά project ανάμεσα σε πελάτες (ή από/προς τα εσωτερικά) απορρίπτεται όσο μένουν κοινά έγγραφα πάνω από τον τοίχο.
    // Το κοινό μπορεί να είναι προς άλλον πελάτη ή προς τα εσωτερικά, όχι μόνο «του ίδιου πελάτη»: λέμε πόσα και τι να κάνει ο admin.
    if (e === "cross_client_shares") {
      var docWord = function (n) { return n + (n === 1 ? " έγγραφο" : " έγγραφα"); };
      var shareVerb = function (n) { return n === 1 ? "μοιράζεται" : "μοιράζονται"; };
      var away = "που, μετά τη μεταφορά, θα είναι σε άλλον πελάτη ή στα εσωτερικά";
      var parts = [];
      if (r.data.owned) parts.push(docWord(r.data.owned) + " του " + w.g + " " + shareVerb(r.data.owned) + " με άλλα " + w.p + " " + away);
      if (r.data.incoming) parts.push(docWord(r.data.incoming) + " από άλλα " + w.p + " (που θα είναι σε άλλον πελάτη ή στα εσωτερικά) " + shareVerb(r.data.incoming) + " προς αυτό");
      return "Δεν μεταφέρεται: " + parts.join(" και ") + ". Αφαίρεσε πρώτα τον διαμοιρασμό από την οθόνη του εγγράφου.";
    }
    var dyn = {
      name_taken: "Υπάρχει ήδη " + w.s + " με αυτό το όνομα.",
      invalid_departments: "Μη έγκυρα " + w.p + ".",
      invalid_projects: "Ένα από τα " + w.p + " δεν είναι έγκυρο."
    };
    return dyn[e] || ERRORS[e] || "Κάτι πήγε στραβά.";
  }
  var ROLE_LABEL = { admin: "Admin", member: "Μέλος", editor: "Editor", employee: "Υπάλληλος" };
  var ACTION_LABEL = {
    login: "σύνδεση", document_hidden: "σήμανση εμπιστευτικού", document_unhidden: "άρση εμπιστευτικού", feedback_closed: "κλείσιμο αναφορών υπαλλήλων", rechecks_run: "εκτέλεση επανελέγχων", document_created: "νέο έγγραφο", document_updated: "αλλαγή εγγράφου", document_deleted: "διαγραφή εγγράφου",
    update_created: "νέο update", update_applied: "ενσωμάτωση update", update_rejected: "απόρριψη update", update_proposal_generated: "πρόταση ενσωμάτωσης",
    contradiction_dismissed: "«δεν είναι αντίφαση»", contradiction_reminder: "υπενθύμιση αντίφασης", contradiction_check: "έλεγχος αντιφάσεων",
    contradiction_check_failed: "αποτυχία ελέγχου αντιφάσεων",     member_added: "νέο μέλος", member_role_changed: "αλλαγή ρόλου",     member_disabled: "απενεργοποίηση μέλους", member_enabled: "ενεργοποίηση μέλους", question_dismissed: "παράβλεψη ερώτησης",
    members_bulk_status: "μαζική αλλαγή κατάστασης",
    workspace_profile_changed: "αλλαγή τύπου χώρου", client_created: "νέος πελάτης", client_renamed: "μετονομασία πελάτη", client_deleted: "διαγραφή πελάτη"
  };

  function actionLabel(a) {
    var w = W();
    var dyn = {
      department_created: "νέο " + w.s, department_renamed: "μετονομασία " + w.g, department_hidden: "απόκρυψη " + w.g,
      department_unhidden: "εμφάνιση " + w.g, member_project_roles_changed: "αλλαγή ρόλων ανά " + w.s,
      member_departments_changed: "αλλαγή " + w.gp + " μέλους", members_bulk_changed: "μαζική αλλαγή " + w.gp,
      project_client_changed: "μεταφορά " + w.g + " σε πελάτη"
    };
    return dyn[a] || ACTION_LABEL[a] || a;
  }

  function load() {
    return api("/team/admin/overview").then(function (r) { if (r.status === 200) data = r.data; })
      .then(function () { return api("/team/admin/documents"); }).then(function (r) { if (r.status === 200) docsData = r.data; })
      .then(function () { return api("/team/admin/audit"); }).then(function (r) { if (r.status === 200) audit = r.data; })
      .then(render);
  }

  function shell(content) {
    clear(app);
    app.appendChild(h("div", { class: "topbar" }, [
      h("h1", { text: (me.workspaceName || "") + " · Διαχείριση" }),
      h("div", null, [h("a", { href: "/team-editor.html", text: "Εισερχόμενα και έγγραφα" }), h("a", { href: "/portal.html", text: "← Αναζήτηση" })]),
    ]));
    var tabs = [["departments", W().P], ["documents", "Έγγραφα"], ["members", "Άνθρωποι"], ["audit", "Ιστορικό ενεργειών"]];
    app.appendChild(h("div", { class: "tabs", role: "tablist" }, tabs.map(function (t) {
      return h("button", { class: "tab" + (tab === t[0] ? " active" : ""), type: "button", role: "tab", id: "tab-" + t[0], text: t[1],
        onclick: function () { beginAction(); tab = t[0]; if (t[0] === "departments") proj.openId = null; render(); } });
    })));
    app.appendChild(content);
  }

  // ---------------------------------------------------------------- τμήματα, πελάτες (τοίχοι) και τύπος χώρου
  // Δύο προφίλ, ένας κώδικας: "company" = μία εταιρεία, επίπεδη λίστα τμημάτων με ελεύθερο διαμοιρασμό. "multi_client" = call center:
  // κάθε πελάτης είναι ΤΟΙΧΟΣ (τίποτα δεν περνά από τον έναν πελάτη στον άλλον) και τα τμήματά του ζουν μέσα του.
  function deptRowFor(d, msg, inClient) {
    var shown = inClient ? (d.shortName || d.name) : d.name;
    var name = h("input", { type: "text", value: shown, maxlength: "60", "aria-label": "Όνομα " + W().g + " " + d.name });
    var rename = h("button", { class: "btn secondary", type: "button", text: "Αποθήκευση ονόματος", onclick: function () {
      beginAction();
      var newNameText = name.value.trim().replace(/\s+/g, " ");
      api("/team/admin/departments/" + encodeURIComponent(d.id), "PATCH", { name: name.value }).then(function (r) {
        if (r.status === 200) { ok(d.name + ": μετονομάστηκε σε " + newNameText); changed("dept-" + d.id); load(); } else { msg.className = "note err"; msg.textContent = errText(r); }
      });
    } });
    var deptRow, deptControls;
    function doToggleHidden() {
      beginAction();
      api("/team/admin/departments/" + encodeURIComponent(d.id), "PATCH", { hidden: !d.hidden }).then(function (r) {
        if (r.status === 200) { ok(d.name + (d.hidden ? ": ορατό " + W().s : ": κρυφό " + W().s)); changed("dept-" + d.id); load(); }
        else { msg.className = "note err"; msg.textContent = errText(r); }
      });
    }
    var toggle = h("button", { class: "btn secondary hide-toggle", type: "button", text: d.hidden ? "Εμφάνιση " + W().g : "Απόκρυψη " + W().g, onclick: function () {

  // ---------------------------------------------------------------- μέλη
  // ---------------------------------------------------------------- άνθρωποι και projects
  // Κατάσταση της οθόνης: ζει έξω από το DOM, ώστε να επιβιώνει κάθε ανανέωση (render) μετά από μια αλλαγή.
  var PAGE_SIZE = 25;
  var MAX_BULK = 100;
  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  var people = { q: "", project: "", roleFilter: "", page: 0, selected: {}, openId: null, bulk: null, focusDetail: false };
  var proj = { openId: null, q: "", page: 0, result: "", showDisabled: false, create: false, invite: true }; // result: τα emails που δεν προστέθηκαν (μένει ορατό και μετά την ανανέωση της σελίδας)

  function memberById(id) { return data.members.filter(function (m) { return m.id === id; })[0] || null; }
  function deptById(id) { return data.departments.filter(function (d) { return d.id === id; })[0] || null; }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
  function initials(email) {
    var name = String(email || "").split("@")[0].replace(/[^A-Za-zΑ-Ωα-ωΆ-Ώά-ώ]+/g, " ").trim();
    var parts = name.split(/\s+/);
    return ((parts[0] || "?").charAt(0) + (parts[1] ? parts[1].charAt(0) : "")).toUpperCase();
  }
  function roleWord(role) { return role === "editor" ? "Editor" : role === "member" ? "Μέλος" : "αφαιρέθηκε"; }
  function option(value, text) { return h("option", { value: value, text: text }); }
  function projectOptions(placeholder) { return [option("", placeholder)].concat(data.departments.map(function (d) { return option(d.id, d.name); })); }
  function selectedIds() { return Object.keys(people.selected).map(Number).filter(function (id) { return !!memberById(id); }); }

  // Δύο κουμπιά «Μέλος | Editor» (αντί για dropdown): φαίνεται η τρέχουσα τιμή και αλλάζει με ένα κλικ.
  function segControl(current, label, onPick) {

    [["member", "Μέλος"], ["editor", "Editor"]].forEach(function (p) {
      wrap.appendChild(h("button", { class: "seg-" + p[0] + (current === p[0] ? " on" : ""), type: "button", "aria-pressed": current === p[0] ? "true" : "false", text: p[1],
        onclick: function () { if (current !== p[0]) onPick(p[0]); } }));

  // Μία αλλαγή ρόλου ενός ατόμου σε ένα project (role: "member" | "editor" | null = αφαίρεση). Κάθε αίτημα στέλνει ΟΛΟΚΛΗΡΟ τον χάρτη
  // ρόλων του ατόμου, γι' αυτό το στοιχείο lockEl κλειδώνει όσο τρέχει: δύο ταυτόχρονες αλλαγές θα μπορούσαν να ανταγωνιστούν.
  function changeProjectRole(m, d, role, lockEl, key) {
    if (lockEl.classList.contains("busy")) return;
    var map = {};
    Object.keys(m.projectRoles || {}).forEach(function (k) { map[k] = m.projectRoles[k]; });
    if (role === null) delete map[d.id]; else map[d.id] = role;
    beginAction();
    lockRow(lockEl, true);
    api("/team/admin/members/" + m.id, "PATCH", { projectRoles: map }).then(function (r) {
      if (r.status === 200) { ok(m.email + ": " + d.name + " → " + roleWord(role)); changed(key); } else { fail(errText(r)); }
      return load();
    });
  }

  function filteredMembers() {
    var q = people.q.trim().toLowerCase();
    return data.members.filter(function (m) {
      if (q && m.email.toLowerCase().indexOf(q) < 0) return false;
      if (people.project && !(m.projectRoles && m.projectRoles[people.project])) return false;
      if (people.roleFilter === "admin" && m.role !== "admin") return false;
      if (people.roleFilter === "editor" && (people.project ? m.projectRoles[people.project] !== "editor" : m.role !== "editor")) return false;
      if (people.roleFilter === "disabled" && m.status !== "disabled") return false;
      return true;
    });
  }

  function pager(total, page, onPage, prefix) {
    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    var from = total === 0 ? 0 : page * PAGE_SIZE + 1;
    var to = Math.min(total, (page + 1) * PAGE_SIZE);
    var prev = h("button", { class: "btn secondary", type: "button", id: prefix + "-prev", text: "Προηγούμενη", onclick: function () { onPage(page - 1); } });
    var next = h("button", { class: "btn secondary", type: "button", id: prefix + "-next", text: "Επόμενη", onclick: function () { onPage(page + 1); } });
    prev.disabled = page <= 0;
    next.disabled = page >= pages - 1;
    return h("div", { class: "pager" }, [
      h("span", { class: "grow", id: prefix + "-info", text: total === 0 ? "Κανένα αποτέλεσμα" : "Δείχνει " + from + "-" + to + " από " + total + " · σελίδα " + (page + 1) + " από " + pages }),
      prev, next,
    ]);
  }

    if (m.role === "admin") return h("span", { class: "muted", text: "πρόσβαση παντού" });
    var mine = data.departments.filter(function (d) { return m.projectRoles && m.projectRoles[d.id]; });
    var wrap = h("span", { class: "chips" });
    if (!mine.length) { wrap.appendChild(h("span", { class: "muted", text: "κανένα " + W().s })); return wrap; }
    mine.slice(0, 2).forEach(function (d) {
      var ed = m.projectRoles[d.id] === "editor";
      wrap.appendChild(h("span", { class: "chip" + (ed ? " ed" : ""), text: d.name + (ed ? " · Editor" : "") }));

  }

          h("div", null, [open, m.role === "admin" ? h("span", { class: "chip ed", text: "Admin" }) : null, m.status === "disabled" ? h("span", { class: "pill off", text: "απενεργοποιημένο" }) : null]),

  // ---- μαζικές ενέργειες
  function bulkSummary(d, project, word) {
    var parts = [plural(d.updated, "μέλος", "μέλη") + (project ? ": " + project.name + " → " + word : "")];
    if (d.created) parts.push(plural(d.created, "νέο μέλος δημιουργήθηκε", "νέα μέλη δημιουργήθηκαν"));
    if (d.skippedAdmins) parts.push(plural(d.skippedAdmins, "admin παραλείφθηκε", "admins παραλείφθηκαν"));
    if (d.notAdded && d.notAdded.length) parts.push(plural(d.notAdded.length, "δεν προστέθηκε", "δεν προστέθηκαν"));
    return parts.join(" · ");
  }
  function runBulkMemberships(panel, ids, projectId, role) {
    if (ids.length > MAX_BULK) { fail("Επίλεξε το πολύ " + MAX_BULK + " άτομα τη φορά."); return; }
    var d = deptById(projectId);
    beginAction();
    lockRow(panel, true);
    api("/team/admin/memberships", "POST", { memberIds: ids, changes: [{ projectId: projectId, role: role }] }).then(function (r) {
      if (r.status === 200) { ok(bulkSummary(r.data, d, roleWord(role))); people.selected = {}; people.bulk = null; } else { fail(errText(r)); }
      return load();
    });
  }
  function runBulkStatus(panel, ids, status) {
    if (ids.length > MAX_BULK) { fail("Επίλεξε το πολύ " + MAX_BULK + " άτομα τη φορά."); return; }
    beginAction();
    lockRow(panel, true);
    api("/team/admin/members/bulk-status", "POST", { memberIds: ids, status: status }).then(function (r) {
      if (r.status === 200) {

  function bulkPanel(ids) {
    var mode = people.bulk;
    var panel = h("div", { class: "bulkpanel", id: "bulk-panel" });
    var project = mode === "disable" ? null : h("select", { id: "bulk-project", "aria-label": W().S }, projectOptions("Διάλεξε " + W().s));

      beginAction();

        if (r.status === 200) { ok(okMsg); changed("member-" + m.id); } else { fail(errText(r)); }

          function () { patch({ role: "admin" }, m.email + ": ρόλος Admin"); },

    var toggle = h("button", { class: "btn " + (m.status === "active" ? "danger" : "secondary") + " status-toggle", type: "button",

  // ---- η λίστα ανθρώπων (ξαναχτίζεται μόνο το περιεχόμενό της, ώστε η αναζήτηση να μη χάνει το πεδίο όταν πληκτρολογείς)
  function drawPeople(scope) {
    var root = scope || app;
    var list = root.querySelector("#people-list");
    if (!list) return;
    var all = filteredMembers();
    var pages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
    if (people.page > pages - 1) people.page = pages - 1;
    if (people.page < 0) people.page = 0;
    var slice = all.slice(people.page * PAGE_SIZE, (people.page + 1) * PAGE_SIZE);
    clear(list);
    if (!slice.length) list.appendChild(h("div", { class: "hint", text: "Κανένα άτομο με αυτά τα φίλτρα." }));
    slice.forEach(function (m) { list.appendChild(personRow(m)); });
    var head = root.querySelector("#sel-page");
    if (head) head.checked = slice.length > 0 && slice.every(function (m) { return !!people.selected[m.id]; });
    var pg = root.querySelector("#people-pager");
    clear(pg);
    pg.appendChild(pager(all.length, people.page, function (p) { people.page = p; drawPeople(); }, "people"));
    drawBulk(root);
    var host = root.querySelector("#member-detail-host");
    clear(host);
    var open = people.openId ? memberById(people.openId) : null;
    if (open) host.appendChild(memberDetail(open)); else people.openId = null;
    // Η καρτέλα ανοίγει κάτω από τη λίστα: όταν την ανοίγει ο χρήστης με κλικ, την φέρνουμε στο οπτικό πεδίο και της δίνουμε focus.
    if (people.focusDetail) {
      people.focusDetail = false;
      var det = host.firstChild;
      if (det) {
        det.setAttribute("tabindex", "-1");
        try { det.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
        if (det.scrollIntoView) det.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
    }
  }

  // ---------------------------------------------------------------- σελίδα project
  function projectView(d) {
    var everyone = data.members.filter(function (m) { return m.projectRoles && m.projectRoles[d.id]; });
    // Οι απενεργοποιημένοι δεν είναι πια "μέλη" για τον admin: κρύβονται και δεν μετράνε, εκτός αν ζητηθούν ("Εμφάνιση απενεργοποιημένων").
    var activeOnly = everyone.filter(function (m) { return m.status !== "disabled"; });
    var disabledN = everyone.length - activeOnly.length;
    var members = proj.showDisabled ? everyone : activeOnly;
    var editors = activeOnly.filter(function (m) { return m.projectRoles[d.id] === "editor"; }).length;
    var box = h("div", { class: "card", id: "project-page" });
    box.appendChild(h("button", { class: "backlink", id: "project-back", type: "button", text: "← Όλα τα " + W().p, onclick: function () { beginAction(); proj.openId = null; render(); } }));
    box.appendChild(h("h2", null, [document.createTextNode(d.name), d.hidden ? h("span", { class: "pill hid", text: " κρυφό" }) : null]));
    box.appendChild(h("p", { class: "hint", id: "project-meta", text: plural(activeOnly.length, "μέλος", "μέλη") + " · " + plural(editors, "editor", "editors") + " · " + plural(d.documentCount, "έγγραφο", "έγγραφα") }));

    var q = h("input", { type: "text", id: "proj-q", placeholder: "Αναζήτηση μέσα στο " + W().s, "aria-label": "Αναζήτηση μέσα στο " + W().s, value: proj.q });
    var list = h("div", { id: "proj-list" });
    var pg = h("div", { id: "proj-pager" });
    function drawProject() {
      var term = proj.q.trim().toLowerCase();
      var all = members.filter(function (m) { return !term || m.email.toLowerCase().indexOf(term) >= 0; });
      var pages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
      if (proj.page > pages - 1) proj.page = pages - 1;
      if (proj.page < 0) proj.page = 0;
      clear(list);
      if (!all.length) list.appendChild(h("div", { class: "hint", text: members.length ? "Κανένα άτομο με αυτή την αναζήτηση." : "Κανένα μέλος ακόμα. Πρόσθεσε ανθρώπους παρακάτω." }));
      all.slice(proj.page * PAGE_SIZE, (proj.page + 1) * PAGE_SIZE).forEach(function (m) {
        var rowEl = h("div", { class: "row proj-member-row", "data-key": "pm-" + m.id, "data-member": String(m.id) }, [
          h("div", { class: "who" }, [h("span", { class: "av", "aria-hidden": "true", text: initials(m.email) }), h("span", { class: "name", text: m.email }),
            m.status === "disabled" ? h("span", { class: "pill off", text: "απενεργοποιημένο" }) : null]),
          h("div", { class: "controls" }, [
            segControl(m.projectRoles[d.id], "Ρόλος του " + m.email, function (role) { changeProjectRole(m, d, role, rowEl, "pm-" + m.id); }),
            h("button", { class: "xbtn remove-project", type: "button", "aria-label": "Αφαίρεση του " + m.email, text: "×", onclick: function () { changeProjectRole(m, d, null, rowEl, "pm-" + m.id); } }),
          ]),
        ]);
        list.appendChild(rowEl);
      });
      clear(pg);
      pg.appendChild(pager(all.length, proj.page, function (p) { proj.page = p; drawProject(); }, "proj"));
    }
    q.addEventListener("input", function () { proj.q = q.value; proj.page = 0; drawProject(); });
    box.appendChild(h("div", { class: "toolbar" }, [q]));
    if (disabledN) {
      var showDis = h("input", { type: "checkbox", id: "proj-show-disabled", "aria-label": "Εμφάνιση απενεργοποιημένων" });

      box.appendChild(h("label", { class: "showdis" }, [showDis, document.createTextNode("Εμφάνιση απενεργοποιημένων (" + disabledN + ")")]));

    // προσθήκη πολλών ανθρώπων με επικόλληση emails (ο συνηθισμένος τρόπος σε BPO: μια ομάδα νέων πρακτόρων μπαίνει μαζί)
    var paste = h("textarea", { id: "paste-emails", "aria-label": "Emails, ένα ανά γραμμή", placeholder: "nikos@bpo.gr\nmaria@bpo.gr" });
    var pasteRole = h("select", { id: "paste-role", "aria-label": "Ρόλος στο " + W().s }, [option("member", "Μέλος"), option("editor", "Editor")]);
    // Οι επιλογές μένουν όπως τις άφησες και μετά από μια προσθήκη (ο χρήστης συνήθως προσθέτει πολλές παρτίδες με τον ίδιο τρόπο).
    var create = h("input", { type: "checkbox", id: "paste-create", "aria-label": "Δημιουργία νέων μελών" });

    create.addEventListener("change", function () { proj.create = create.checked; });
    var invite = h("input", { type: "checkbox", id: "paste-invite", "aria-label": "Πρόσκληση σε όσους δημιουργούνται" });
    invite.checked = proj.invite !== false;
    invite.addEventListener("change", function () { proj.invite = invite.checked; });
    var result = h("p", { class: "note", id: "paste-result", role: "status", "aria-live": "polite", text: proj.result });
    var add = h("button", { class: "btn", id: "paste-add", type: "button", text: "Προσθήκη" });
    add.addEventListener("click", function () {
      if (add.disabled) return;
      var seen = {}, emails = [], bad = [];
      paste.value.split(/[\s,;]+/).filter(Boolean).forEach(function (raw) {
        var e = raw.toLowerCase();
        if (!EMAIL_RE.test(e)) { bad.push(raw); return; }
        if (!seen[e]) { seen[e] = true; emails.push(e); }
      });
      if (bad.length) { fail("Δεν είναι σωστά emails: " + bad.slice(0, 3).join(", ") + (bad.length > 3 ? "…" : "")); return; }
      if (!emails.length) { fail("Επικόλλησε τουλάχιστον ένα email."); return; }
      if (emails.length > MAX_BULK) { fail("Το πολύ " + MAX_BULK + " emails τη φορά."); return; }
      beginAction();
      proj.result = "";
      result.textContent = "";
      add.disabled = true;
      api("/team/admin/memberships", "POST", { emails: emails, createMissing: create.checked, sendInvite: create.checked && invite.checked, changes: [{ projectId: d.id, role: pasteRole.value }] }).then(function (r) {
        add.disabled = false;
        if (r.status !== 200) { fail(errText(r)); return; }
        // Αν δεν προστέθηκε κανείς, δεν είναι επιτυχία: κόκκινο μήνυμα (μένει μέχρι την επόμενη ενέργεια).
        if (!r.data.updated && !r.data.created) fail("Δεν προστέθηκε κανείς" + (r.data.notAdded && r.data.notAdded.length ? " · " + plural(r.data.notAdded.length, "δεν προστέθηκε", "δεν προστέθηκαν") : "") + ".");
        else ok(bulkSummary(r.data, d, roleWord(pasteRole.value)));
        paste.value = "";
        proj.result = r.data.notAdded && r.data.notAdded.length
          ? "Δεν προστέθηκαν: " + r.data.notAdded.join(", ") + ". Αν είναι νέοι άνθρωποι, τσέκαρε «Δημιουργία νέων μελών» και ξαναδοκίμασε."
          : "";
        return load();
      });
    });
    box.appendChild(h("div", { class: "pastebox" }, [
      h("div", { class: "name", text: "Προσθήκη ανθρώπων" }),
      h("p", { class: "hint", text: "Επικόλλησε emails, ένα ανά γραμμή (ή χωρισμένα με κόμμα). Όσοι είναι ήδη στον οργανισμό μπαίνουν στο " + W().s + "." }),
      paste,
      h("div", { class: "controls", style: "margin-top:8px;" }, [pasteRole, h("label", { class: "checks" }, [create, document.createTextNode("Δημιουργία νέων μελών για emails που δεν υπάρχουν")]),
        h("label", { class: "checks" }, [invite, document.createTextNode("Στείλε πρόσκληση στους νέους")]), add]),
      result,
    ]));
    drawProject();
    return box;
  }

  // ---------------------------------------------------------------- έγγραφα
  function documentsView() {
    var box = h("div", { class: "card" }, [
      h("h2", { text: "Έγγραφα" }),
      h("p", { class: "hint", text: "Ένα εμπιστευτικό έγγραφο το διαβάζουν μόνο οι admins και τα μέλη του ίδιου " + W().g + ": δεν μοιράζεται με άλλα " + W().p + " και μια αντίφαση μαζί του εμφανίζεται χωρίς περιεχόμενο. Η κοινή χρήση ενός εγγράφου με άλλα " + W().p + " ορίζεται από την οθόνη επεξεργασίας του εγγράφου. Έγγραφα «όλης της εταιρείας» δεν μπορούν να γίνουν εμπιστευτικά." }),
    ]);
    var msg = h("p", { class: "note", role: "status", "aria-live": "polite" });
    var docs = (docsData && docsData.documents) || [];
    if (!docs.length) box.appendChild(h("div", { class: "hint", text: "Κανένα έγγραφο ακόμα." }));
    docs.forEach(function (d) {
      var docRow, docControls;
      var sharedWith = (d.audienceProjectIds || []).map(function (id) { var x = deptById(id); return x ? x.name : "άγνωστο " + W().s; });
      function doToggleDoc() {
        beginAction();
        api("/team/admin/documents/" + encodeURIComponent(d.id), "PATCH", { hidden: !d.hidden }).then(function (r) {
          if (r.status === 200) { ok(d.title + (d.hidden ? ": δεν είναι πια εμπιστευτικό" : ": εμπιστευτικό")); changed("doc-" + d.id); load(); }
          else { fail(r.data && r.data.error === "company_wide_cannot_hide" ? "Έγγραφα όλης της εταιρείας δεν μπορούν να γίνουν εμπιστευτικά." : errText(r)); load(); }
        });
      }
      var toggle = h("button", { class: "btn secondary doc-hide-toggle", type: "button", text: d.hidden ? "Άρση εμπιστευτικού" : "Σήμανση ως εμπιστευτικό", onclick: function () {
        // Ένα εμπιστευτικό έγγραφο δεν μοιράζεται: η σήμανση αφαιρεί το ακροατήριο και η άρση δεν το επαναφέρει. Προειδοποιούμε πριν.
        if (!d.hidden && sharedWith.length) {
          confirmFirst(docRow, docControls, "Το έγγραφο μοιράζεται με " + plural(sharedWith.length, W().s, W().p) + ". Αν γίνει εμπιστευτικό θα σταματήσει να μοιράζεται και δεν επανέρχεται μόνο του. Σίγουρα;", doToggleDoc);
          return;
        }
        doToggleDoc();
      } });
      var bits = d.departmentName + (sharedWith.length ? " · κοινό με " + sharedWith.slice(0, 3).join(", ") + (sharedWith.length > 3 ? " +" + (sharedWith.length - 3) : "") : "") + (d.pendingUpdates ? " · " + d.pendingUpdates + " update" : "") + (d.openContradictions ? " · " + d.openContradictions + (d.openContradictions === 1 ? " αντίφαση" : " αντιφάσεις") : "");
      docControls = h("div", { class: "controls" }, [toggle]);
      docRow = h("div", { class: "row doc-row", "data-key": "doc-" + d.id }, [
        h("div", null, [h("span", { class: "name", text: d.title }), d.hidden ? h("span", { class: "pill hid", text: "εμπιστευτικό" }) : null, h("div", { class: "meta", text: bits })]),
        docControls,
      ]);
      box.appendChild(docRow);
    });
    box.appendChild(h("div", { class: "row" }, [
      h("div", null, [h("span", { class: "name", text: "Επανέλεγχος αντιφάσεων" }), h("div", { class: "meta", text: "Μετά από κάθε δημοσίευση προγραμματίζεται αυτόματα δεύτερος έλεγχος σε λίγα λεπτά. Εδώ μπορείς να τον τρέξεις αμέσως." })]),
      h("div", { class: "controls" }, [h("button", { class: "btn secondary", id: "run-rechecks", type: "button", text: "Εκτέλεση τώρα", onclick: function () {
        beginAction();
        msg.className = "note"; msg.textContent = "Εκτέλεση…";
        api("/team/admin/rechecks/run", "POST").then(function (r) {
          if (r.status === 200) { msg.className = "note ok"; msg.textContent = "Ελέγχθηκαν " + r.data.processed + " έγγραφα, βρέθηκαν " + r.data.created + " νέες αντιφάσεις."; }
          else { msg.className = "note err"; msg.textContent = errText(r); }
        });
      } })]),
    ]));
    box.appendChild(msg);
    return box;
  }

  // ---------------------------------------------------------------- ιστορικό
  function auditView() {
    var box = h("div", { class: "card" }, [
      h("h2", { text: "Ιστορικό ενεργειών" }),
      h("p", { class: "hint", text: "Οι τελευταίες 100 διαχειριστικές ενέργειες. Δεν καταγράφονται οι ερωτήσεις των υπαλλήλων ούτε το τι διάβασαν. Διατήρηση: " + (audit ? audit.retentionDays : 365) + " ημέρες." }),
    ]);
    var entries = (audit && audit.entries) || [];
    if (!entries.length) box.appendChild(h("div", { class: "hint", text: "Καμία ενέργεια ακόμα." }));
    entries.forEach(function (e) {
      box.appendChild(h("div", { class: "row log" }, [
        h("span", null, [h("span", { class: "a", text: e.actor }), document.createTextNode(" · " + actionLabel(e.action) + (e.target ? " · " + (e.targetLabel || e.target) : "") + (e.detail && typeof e.detail.count === "number" && /^members_bulk_/.test(e.action) ? " · " + plural(e.detail.count, "μέλος", "μέλη") : ""))]),
        h("span", { class: "t", text: new Date(e.at).toLocaleString("el-GR") }),
      ]));
    });
    return box;
  }

  function render() {
    if (!data) return;
    shell(tab === "departments" ? departmentsView() : tab === "documents" ? documentsView() : tab === "members" ? membersView() : auditView());
    flashRow();
  }

  api("/team/me").then(function (r) {
    if (r.status === 0) throw new Error("network");
    if (r.status !== 200) { window.location.replace("/portal.html"); return; }
    me = r.data;
    if (me.role !== "admin") { window.location.replace(me.role === "editor" ? "/team-editor.html" : "/portal.html"); return; }
    return load();
  }).catch(function () { app.appendChild(h("p", { text: "Δεν ήταν δυνατή η φόρτωση." })); });
})();
</script>
</body>
</html>
