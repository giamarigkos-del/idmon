<!DOCTYPE html>
<!-- public\team-editor.html -->
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Εισερχόμενα και έγγραφα · Idmon για ομάδες</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="/team.css">
<style>
  /* Section W (30 Σεπ 2026): οθόνη editor του "Idmon για ομάδες". Δύο όψεις: Εισερχόμενα (αντιφάσεις, updates προς ενσωμάτωση, αναπάντητες
     ερωτήσεις) και Έγγραφα. Οι editors γράφουν ΜΟΝΟ στο δικό τους project, οι admins παντού. Ο έλεγχος γίνεται στον server, εδώ απλώς
     κρύβουμε ό,τι δεν επιτρέπεται. Όλα τα δεδομένα μπαίνουν με textContent (ποτέ innerHTML).
     2 Οκτ 2026: τα κοινά στυλ ζουν στο team.css. Εδώ μένουν μόνο όσα αφορούν αυτή τη σελίδα. */
  .counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px;}
  .count{border-radius:var(--r-lg);padding:10px 14px;background:var(--surface);border:1px solid var(--border);}
  .count .l{font-size:var(--fs-xs);color:var(--text-soft);} .count .n{font-size:var(--fs-num);font-weight:600;line-height:1.2;}
  .count.danger{background:rgba(229,100,107,.12);border-color:rgba(229,100,107,.4);} .count.danger .n,.count.danger .l{color:var(--danger);}
  .count.warn{background:var(--warn-bg);border-color:var(--warn-border);} .count.warn .n,.count.warn .l{color:var(--warn-border);}
  h2.sec{font-size:var(--fs-md);margin:26px 0 6px;font-weight:600;}
  .sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:10px 0;}
  .side{border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;}
  .side .who{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--text-soft);margin-bottom:6px;}
  .side .q{font-size:var(--fs-sm);line-height:1.6;}
  .side.hidden-side{border-style:dashed;}
  mark{background:rgba(229,100,107,.22);color:var(--danger);padding:1px 4px;border-radius:4px;}
  .status{font-size:var(--fs-xs);color:var(--text-soft);margin:6px 0;}
  .qrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--border);font-size:var(--fs-md);}
  .qrow .c{font-size:var(--fs-xs);color:var(--text-soft);}
  /* έγγραφα */
  .grid{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:22px;align-items:start;}
  @media (max-width:760px){.grid{grid-template-columns:1fr;}}
  /* κάθε έγγραφο της λίστας είναι κουμπί */
  .item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--border);
    border-radius:var(--r);padding:10px 14px;margin-top:8px;min-height:var(--h-btn);color:var(--text);cursor:pointer;font-family:inherit;}
  .item .t{font-size:var(--fs-md);} .item .m{font-size:var(--fs-xs);color:var(--text-soft);} .item.active .t{color:var(--accent);}
  .item:hover{border-color:var(--accent);} .item.active{border-color:var(--accent);background:var(--accent-soft);}
  .item.new-doc{background:var(--accent);color:var(--on-accent);border-color:transparent;align-items:center;font-weight:700;margin-top:0;}
  .item.new-doc .t,.item.new-doc.active .t{color:var(--on-accent);}
  #panel input[type=text],#panel select{width:100%;}
  .ro{font-size:var(--fs-sm);color:var(--text-soft);margin:0 0 6px;}
  .readonly-text{white-space:pre-wrap;line-height:1.7;font-size:var(--fs-md);margin:12px 0 0;}
  .pending{border:1px dashed var(--warn-border);border-radius:var(--r);padding:8px 12px;margin:12px 0;font-size:var(--fs-sm);}
  .pending .h{font-size:var(--fs-xs);color:var(--warn-border);margin-bottom:4px;}
  hr.sep{border:none;border-top:1px solid var(--border);margin:18px 0;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var me = null;
  // Η λέξη για το τμήμα: στο προφίλ «Εταιρεία» λέγεται «τμήμα», και στο call center λέγεται «τμήμα» (ΜΙΑ λέξη παντού: ο αρχάριος δεν πρέπει να αναρωτιέται αν «έργο» και «τμήμα» είναι το ίδιο).
  // Μορφές: s = ενικός, g = γενική ενικού, p = πληθυντικός, gp = γενική πληθυντικού, S/P = με κεφαλαίο.
  var WORDS = {
    company: { s: "τμήμα", g: "τμήματος", p: "τμήματα", gp: "τμημάτων", S: "Τμήμα", P: "Τμήματα" },
    multi_client: { s: "τμήμα", g: "τμήματος", p: "τμήματα", gp: "τμημάτων", S: "Τμήμα", P: "Τμήματα" }
  };
  function W() { return me && me.profile === "multi_client" ? WORDS.multi_client : WORDS.company; }
  var departments = [];
  var docs = [];
  var inbox = null;
  var view = "inbox"; // "inbox" | "docs"
  var currentId = null; // null = νέο έγγραφο
  var prefillTitle = "";
  var flash = null;

  // ---------------------------------------------------------------- βοηθητικά
  function h(tag, props, children) {
    var node = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      if (k === "class") node.className = props[k];
      else if (k === "text") node.textContent = props[k];
      else if (k === "value") node.value = props[k];
      else if (k.slice(0, 2) === "on") node.addEventListener(k.slice(2), props[k]);
      else node.setAttribute(k, props[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return node;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function api(path, method, body) {
    var opts = { method: method || "GET", headers: {}, credentials: "same-origin" };
    if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    return fetch(path, opts).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) { return { status: res.status, data: data }; });
    });
  }
  var ERRORS = {
    forbidden: "Δεν έχεις δικαίωμα για αυτή την ενέργεια. Ζήτησε βοήθεια από τον διαχειριστή.", invalid_title: "Ο τίτλος είναι κενός ή πολύ μεγάλος. Γράψε έναν τίτλο έως 200 χαρακτήρες.",
    text_required: "Γράψε κείμενο.", text_too_long: "Το κείμενο είναι πολύ μεγάλο.", invalid_text: "Το κείμενο είναι κενό ή πολύ μεγάλο.",
    ai_unavailable: "Ο πάροχος AI δεν είναι διαθέσιμος. Δοκίμασε ξανά σε λίγο.", bad_proposal: "Η πρόταση δεν ήταν χρήσιμη. Δοκίμασε ξανά ή γράψε το κείμενο μόνος σου.",
    cooldown: "Έχει ήδη σταλεί υπενθύμιση πρόσφατα.",     not_found: "Δεν βρέθηκε (ίσως άλλαξε στο μεταξύ). Ανανέωσε τη σελίδα.", not_open: "Έχει ήδη επιλυθεί.",
                audience_not_allowed: "Ένα έγγραφο όλης της εταιρείας το βλέπουν ήδη όλοι: δεν μοιράζεται ξεχωριστά.",
        audience_unavailable: "Η κοινή χρήση εγγράφων δεν είναι ακόμα διαθέσιμη σε αυτόν τον χώρο (λείπει μια ενημέρωση βάσης). Ειδοποίησε τον διαχειριστή.",
    audience_cross_client: "Ένα έγγραφο μοιράζεται μόνο με τμήματα του ΙΔΙΟΥ πελάτη, ποτέ με άλλον πελάτη ή με τα εσωτερικά του call center.",
    cross_client_move: "Ένα έγγραφο δεν μετακινείται σε τμήμα άλλου πελάτη ή σε «όλη η εταιρεία». Δημιούργησε νέο έγγραφο εκεί και σβήσε το παλιό αν χρειάζεται."
  };
  function errText(r) {
    var e = r.data && r.data.error;
    var w = W();
    var dyn = {
      has_pending_updates: "Το " + w.s + " ή ο κύκλος αναγνωστών του εγγράφου δεν αλλάζει όσο υπάρχουν συμπληρώματα που δεν έχουν ενσωματωθεί. Ενσωμάτωσέ τα ή απόρριψέ τα πρώτα.",
      invalid_audience: "Η επιλογή " + w.gp + " για κοινή χρήση δεν είναι έγκυρη. Ξαναφόρτωσε τη σελίδα και δοκίμασε ξανά.",
      audience_too_large: "Ένα έγγραφο μπορεί να μοιραστεί με το πολύ 10 " + w.p + " συνολικά (μαζί με αυτό που το κατέχει).",
      audience_forbidden: "Μπορείς να μοιράσεις το έγγραφο μόνο με " + w.p + " στα οποία ανήκεις και εσύ.",
      hidden_cannot_have_audience: "Ένα εμπιστευτικό έγγραφο, ή έγγραφο κρυφού " + w.g + ", δεν μοιράζεται με άλλα " + w.p + "."
    };
    return dyn[e] || ERRORS[e] || "Κάτι πήγε στραβά. Δοκίμασε ξανά ή ανανέωσε τη σελίδα.";
  }

  // Διαφορά κειμένου σε επίπεδο προτάσεων (LCS). Επιστρέφει [{type: same|del|add, text}].
  function units(text) {
    var out = [];
    String(text).split(/\n+/).forEach(function (line) {
      var parts = line.match(/[^.!;·]+[.!;·]?\s*/g) || [line];
      parts.forEach(function (p) { p = p.trim(); if (p) out.push(p); });
    });
    return out;
  }
  function diffText(a, b) {
    var x = units(a), y = units(b), n = x.length, m = y.length, i, j;
    var t = [];
    for (i = 0; i <= n; i++) { t.push(new Array(m + 1).fill(0)); }
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) t[i][j] = x[i] === y[j] ? t[i + 1][j + 1] + 1 : Math.max(t[i + 1][j], t[i][j + 1]);
    var ops = []; i = 0; j = 0;
    while (i < n && j < m) {
      if (x[i] === y[j]) { ops.push({ type: "same", text: x[i] }); i++; j++; }
      else if (t[i + 1][j] >= t[i][j + 1]) { ops.push({ type: "del", text: x[i] }); i++; }
      else { ops.push({ type: "add", text: y[j] }); j++; }
    }
    while (i < n) ops.push({ type: "del", text: x[i++] });
    while (j < m) ops.push({ type: "add", text: y[j++] });
    return ops;
  }
  function renderDiff(base, proposed) {
    var box = h("div", { class: "diff", "aria-label": "Αλλαγές" });
    diffText(base, proposed).forEach(function (op) {
      box.appendChild(h("div", { class: op.type, text: (op.type === "del" ? "− " : op.type === "add" ? "+ " : "  ") + op.text }));
    });
    return box;
  }

  // ==== ΜΕΝΟΥ ΧΡΗΣΤΗ ΚΑΙ ΚΥΚΛΑΚΙ ΑΡΙΘΜΟΥ: ΚΟΙΝΟ ΣΤΙΣ ΤΡΕΙΣ ΣΕΛΙΔΕΣ (portal, team-editor, team-admin) ====
  // Πρέπει να είναι ΙΔΙΟ αυτολεξεί και στις τρεις: το ελέγχει το τεστ της ενότητας 32. Αν το αλλάξεις, άλλαξέ το και στις τρεις.
  var USER_ROLE_NAME = { admin: "Διαχειριστής", editor: "Συντάκτης", employee: "Υπάλληλος" };
  function menuInitials(email) {
    var name = String(email || "").split("@")[0].replace(/[^A-Za-zΑ-Ωα-ωΆ-Ώά-ώ]+/g, " ").trim();
    var parts = name.split(/\s+/);
    return ((parts[0] || "?").charAt(0) + (parts[1] ? parts[1].charAt(0) : "")).toUpperCase();
  }
  // Κυκλάκι με αριθμό: δεν υπάρχει όταν δεν υπάρχει τίποτα νέο, δείχνει «99+» πάνω από 99. Είναι διακοσμητικό (aria-hidden):
  // ο αριθμός λέγεται από το aria-label του κουμπιού (countLabel).
  function countBadge(n) {
    n = Number(n);
    if (!isFinite(n) || n < 1) return null;
    return h("span", { class: "count-badge", "aria-hidden": "true", text: n > 99 ? "99+" : String(Math.floor(n)) });
  }
  function countLabel(n) {
    n = Math.floor(Number(n));
    return n > 99 ? "πάνω από 99 νέα" : n === 1 ? "1 νέο" : n + " νέα";
  }
  // Μενού λογαριασμού: κουμπί με τα αρχικά (τέρμα δεξιά, τελευταίο στη σειρά) που ανοίγει μικρό μενού με το email, τον ρόλο και το «Έξοδος».
  // Κλείνει με Esc, με κλικ έξω ή όταν φεύγεις με Tab. Οι ακροατές εγγράφου μπαίνουν ΜΟΝΟ όσο το μενού είναι ανοιχτό.
  function userMenu(me, onLogout) {
    var isOpen = false;
    var wrap = h("div", { class: "user-menu-wrap" });
    var btn = h("button", { class: "avatar-btn", type: "button", id: "user-menu-btn", "aria-haspopup": "menu", "aria-expanded": "false",
      "aria-controls": "user-menu", "aria-label": "Ο λογαριασμός μου (" + (me.email || "") + ")", text: menuInitials(me.email),
      onclick: function () { setOpen(!isOpen, false); } });
    var logout = h("button", { class: "btn secondary um-item", type: "button", role: "menuitem", id: "logout", text: "Έξοδος",
      onclick: function () { setOpen(false, false); api("/team/logout", "POST").then(onLogout); } });
    var panel = h("div", { class: "user-menu", id: "user-menu", role: "menu", "aria-label": "Λογαριασμός" }, [
      h("div", { class: "um-head" }, [
        h("div", { class: "um-email", text: me.email || "" }),
        h("div", { class: "um-meta", text: (USER_ROLE_NAME[me.role] || "") + (me.workspaceName ? " · " + me.workspaceName : "") }),
      ]),
      logout,
    ]);
    panel.hidden = true;
    function onDocClick(e) { if (!wrap.contains(e.target)) setOpen(false, false); }
    function onKey(e) {
      if (e.key === "Escape") { e.preventDefault(); setOpen(false, true); }
      else if (e.key === "Tab") setOpen(false, false);
    }
    function setOpen(next, returnFocus) {
      isOpen = next;
      panel.hidden = !next;
      btn.setAttribute("aria-expanded", next ? "true" : "false");
      if (next) {
        document.addEventListener("click", onDocClick, true);
        document.addEventListener("keydown", onKey, true);
        logout.focus();
      } else {
        document.removeEventListener("click", onDocClick, true);
        document.removeEventListener("keydown", onKey, true);
        if (returnFocus) btn.focus();
      }
    }
    wrap.appendChild(btn);
    wrap.appendChild(panel);
    return wrap;
  }
  // ==== ΤΕΛΟΣ ΚΟΙΝΟΥ ΜΠΛΟΚ ====

  // ---------------------------------------------------------------- κορυφή
  function renderShell(content) {
    clear(app);
    var total = inbox ? inbox.counts.contradictions + inbox.counts.updates + inbox.counts.questions + (inbox.counts.feedback || 0) : 0;
    var links = [h("a", { href: "/portal.html", class: "btn secondary", text: "← Αναζήτηση" })];
    if (me.role === "admin") links.push(h("a", { href: "/team-admin.html", class: "btn secondary", text: "Διαχείριση" }));
    links.push(userMenu(me, function () { window.location.assign("/portal.html"); }));
    app.appendChild(h("div", { class: "topbar" }, [h("h1", { text: (me.workspaceName || "") + " · Συντάκτης" }), h("div", { class: "topnav" }, links)]));
    var inboxTab = h("button", { class: "tab" + (view === "inbox" ? " active" : ""), type: "button", role: "tab", id: "tab-inbox",
      onclick: function () { view = "inbox"; refreshInbox(); }, text: "Εισερχόμενα" });
    var inboxBadge = countBadge(total);
    if (inboxBadge) { inboxTab.appendChild(inboxBadge); inboxTab.setAttribute("aria-label", "Εισερχόμενα, " + countLabel(total)); }
    app.appendChild(h("div", { class: "tabs", role: "tablist" }, [
      inboxTab,
      h("button", { class: "tab" + (view === "docs" ? " active" : ""), type: "button", role: "tab", id: "tab-docs",
        onclick: function () { view = "docs"; refreshDocs(); }, text: "Έγγραφα" }),
    ]));
    app.appendChild(content);
  }

  // ---------------------------------------------------------------- εισερχόμενα
  function refreshInbox() {
    return api("/team/inbox").then(function (r) { if (r.status === 200) inbox = r.data; renderInbox(); });
  }

  function highlight(node, quote) { node.appendChild(h("mark", { text: quote })); }

  function contradictionCard(c) {
    var msg = h("p", { class: "note", role: "status", "aria-live": "polite" });
    var otherHiddenOrForeign = c.sides.some(function (s) { return s.hidden || !s.editable; });
    var sides = h("div", { class: "sides" }, c.sides.map(function (s) {
      if (s.hidden) {
        return h("div", { class: "side hidden-side" }, [
          h("div", { class: "who" }, [h("span", { text: "Έγγραφο που δεν έχεις πρόσβαση" }), h("span", { class: "pill hid", text: "χωρίς πρόσβαση" })]),
          h("div", { class: "q", text: "Υπάρχει αντίφαση με έγγραφο που δεν έχεις πρόσβαση. Ειδοποιήθηκαν οι υπεύθυνοι. Μπορείς να στείλεις και υπενθύμιση." }),
        ]);
      }
      var q = h("div", { class: "q" }); highlight(q, s.quote);
      return h("div", { class: "side" }, [
        h("div", { class: "who" }, [h("span", { text: s.title + " · " + s.departmentName }),
          s.editable ? h("span", { class: "pill you", text: "Δικό σου" }) : h("span", { class: "pill", text: "μόνο ανάγνωση" })]),
        q,
        h("div", { class: "actions" }, [h("button", { class: "btn secondary", type: "button", text: "Άνοιγμα", onclick: function () { openDoc(s.documentId); } })]),
      ]);
    }));
    var actions = h("div", { class: "actions" }, [
      h("button", { class: "btn secondary", type: "button", text: "Δεν είναι αντίφαση", onclick: function () {
        api("/team/contradictions/" + c.id + "/dismiss", "POST").then(function (r) {
          if (r.status === 200) refreshInbox(); else { msg.className = "note err"; msg.textContent = errText(r); }
        });
      } }),
    ]);
    if (otherHiddenOrForeign) {
      actions.appendChild(h("button", { class: "btn secondary", type: "button", text: "Υπενθύμιση στο άλλο τμήμα", onclick: function () {
        api("/team/contradictions/" + c.id + "/remind", "POST").then(function (r) {
          if (r.status === 200) { msg.className = "note ok"; msg.textContent = "Στάλθηκε υπενθύμιση."; }
          else { msg.className = "note err"; msg.textContent = errText(r); }
        });
      } }));
    }
    var status = c.notifiedAt ? "Έχουν ειδοποιηθεί οι υπεύθυνοι." : "Βρέθηκε αυτόματα κατά τη δημοσίευση.";
    return h("div", { class: "card contradiction" }, [
      h("h3", { text: c.topic || "Πιθανή αντίφαση" }), h("p", { class: "status", text: status }), sides, actions, msg,
    ]);
  }

  function updateCard(u) {
    var msg = h("p", { class: "note", role: "status", "aria-live": "polite" });
    var area = h("div", null);
    var propose = h("button", { class: "btn", type: "button", text: "Πρότεινε ενσωμάτωση" });
    propose.addEventListener("click", function () {
      propose.disabled = true; msg.className = "note"; msg.textContent = "Ετοιμάζω πρόταση…";
      api("/team/updates/" + u.id + "/propose", "POST").then(function (r) {
        propose.disabled = false;
        if (r.status !== 200) { msg.className = "note err"; msg.textContent = errText(r); return; }
        msg.textContent = "";
        clear(area);
        var text = h("textarea", { "aria-label": "Τελικό κείμενο εγγράφου" }); text.value = r.data.proposedText;
        var diffBox = h("div", null, [renderDiff(r.data.baseText, r.data.proposedText)]);
        text.addEventListener("input", function () { clear(diffBox); diffBox.appendChild(renderDiff(r.data.baseText, text.value)); });
        var apply = h("button", { class: "btn", type: "button", text: "Εφαρμογή στο άρθρο" });
        apply.addEventListener("click", function () {
          apply.disabled = true;
          api("/team/updates/" + u.id + "/apply", "POST", { text: text.value }).then(function (a) {
            if (a.status === 200) { flash = "Το συμπλήρωμα ενσωματώθηκε στο άρθρο (έκδοση " + a.data.version + ")."; refreshInbox(); }
            else { apply.disabled = false; msg.className = "note err"; msg.textContent = errText(a); }
          });
        });
        area.appendChild(h("p", { class: "hint", text: "Έλεγξε τις αλλαγές. Μπορείς να διορθώσεις το κείμενο πριν το εγκρίνεις. Τίποτα δεν εφαρμόζεται μέχρι να πατήσεις «Εφαρμογή»." }));
        area.appendChild(diffBox);
        area.appendChild(h("label", { text: "Τελικό κείμενο (επεξεργάσιμο)" }));
        area.appendChild(text);
        area.appendChild(h("div", { class: "actions" }, [apply]));
      });
    });
    var reject = h("button", { class: "btn danger", type: "button", text: "Απόρριψη συμπληρώματος", onclick: function () {

      var unote = h("p", { class: "note", role: "status", "aria-live": "polite" });
      var ubtn = h("button", { class: "btn secondary", type: "submit", text: "Δημοσίευση συμπληρώματος" });
      panel.appendChild(h("hr", { class: "sep" }));
      panel.appendChild(h("h3", { text: "Προσθήκη συμπληρώματος" }));
      panel.appendChild(h("p", { class: "hint", text: "Για μια πρόσφατη αλλαγή που δεν θες να ξαναγράψεις ακόμα όλο το άρθρο. Ο βοηθός και οι υπάλληλοι την βλέπουν αμέσως, και την ενσωματώνεις αργότερα από τα Εισερχόμενα." }));
      panel.appendChild(h("form", { id: "update-form", onsubmit: function (e) {
        e.preventDefault();
        ubtn.disabled = true; unote.className = "note"; unote.textContent = "Δημοσίευση…";
        api("/team/updates", "POST", { documentId: currentId, text: utext.value }).then(function (r) {
          ubtn.disabled = false;
          if (r.status === 201) { flash = "Το συμπλήρωμα δημοσιεύτηκε και είναι ήδη αναζητήσιμο."; refreshDocs(); }
          else { unote.className = "note err"; unote.textContent = errText(r); }
        });
      } }, [utext, h("div", { class: "actions" }, [ubtn]), unote]));
    }
  }

  // ---------------------------------------------------------------- εκκίνηση
  var params = new URLSearchParams(window.location.search);
  api("/team/me").then(function (r) {
    if (r.status !== 200) { window.location.replace("/portal.html"); return; }
    me = r.data;
    if (me.role === "employee") { window.location.replace("/portal.html"); return; }
    return api("/team/departments").then(function (dr) {
      departments = (dr.data && dr.data.departments) || [];
      if (params.get("doc")) { currentId = params.get("doc"); view = "docs"; return refreshDocs(); }
      return refreshInbox();
    });
  }).catch(function () { app.appendChild(h("p", { text: "Δεν ήταν δυνατή η φόρτωση." })); });
})();
</script>
</body>
</html>
