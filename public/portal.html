<!DOCTYPE html>
<!-- public\portal.html -->
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Idmon για ομάδες</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="/team.css">
<style>
  /* Section W (30 Σεπ 2026): πύλη υπαλλήλου του "Idmon για ομάδες". Ξεχωριστή σελίδα από το home.html (απόφαση: δεν αγγίζουμε τη σελίδα
     των SMB). Αναζήτηση πρώτα, από κάτω τα πρόσφατα updates και τα έγγραφα. Όλα τα δεδομένα μπαίνουν με textContent (ποτέ innerHTML),
     οπότε κανένα περιεχόμενο εγγράφου δεν εκτελείται ως HTML.
     2 Οκτ 2026: τα κοινά στυλ (κουμπιά, πεδία, ετικέτες, focus) ζουν στο team.css. Εδώ μένουν μόνο όσα αφορούν αυτή τη σελίδα. */
  body{min-height:100vh;}
  .wrap{max-width:900px;}
  .topbar{margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-md);font-weight:600;}
  .pill{background:var(--accent-soft);color:var(--accent);}
  .userbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--text-soft);}
  /* Πράκτορας που δουλεύει για περισσότερους από έναν πελάτες: ο βοηθός ψάχνει σε ΕΝΑΝ πελάτη τη φορά, γι' αυτό η επιλογή είναι εμφανής. */
  .wallrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding:10px 14px;border:1px solid var(--accent);border-radius:var(--r);background:var(--accent-soft);}
  .wallrow label{margin:0;color:var(--text);font-weight:600;font-size:var(--fs-md);}
  .wallrow select{min-width:200px;height:var(--h-input);}
  .wallrow .note{margin:0;min-height:0;}
  .searchrow{display:flex;gap:8px;margin-bottom:8px;}
  .searchrow input{flex:1;min-width:0;height:48px;font-size:1rem;padding:0 14px;}
  .searchrow .btn{height:48px;padding:0 22px;font-size:var(--fs-md);}
  .ai-note{margin:0 0 16px;}
  .card{padding:14px 16px;}
  .answer{margin-bottom:22px;}
  .answer .label{font-size:var(--fs-xs);color:var(--text-soft);margin:0 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .answer .body{font-size:var(--fs-md);line-height:1.65;white-space:pre-wrap;word-wrap:break-word;margin:0 0 10px;}
  .answer .source{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--text-soft);}
  .answer .handoff{margin:10px 0 0;padding-top:8px;border-top:1px solid var(--border);font-size:var(--fs-sm);color:var(--text-soft);}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;}
  .cols h2{font-size:var(--fs-md);margin:0 0 6px;font-weight:600;}
  /* κάθε γραμμή λίστας είναι κουμπί (class btn secondary listbtn στο team.css): ο χρήστης καταλαβαίνει ότι πατιέται */
  .row .title{min-width:0;text-align:left;overflow-wrap:anywhere;}
  .row .meta{font-size:var(--fs-xs);color:var(--text-soft);display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto;}
  .empty{padding:10px 0;}
  .badge{font-size:var(--fs-xs);padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--warn-bg);color:var(--warn-border);}
  .badge.new{background:rgba(79,174,124,.16);color:var(--ok);}
  /* σύνδεση */
  .loginbox{max-width:420px;margin:12vh auto 0;}
  .loginbox h1{font-size:var(--fs-xl);margin:0 0 6px;}
  .loginbox p{color:var(--text-soft);font-size:var(--fs-md);line-height:1.55;margin:0 0 16px;}
  .loginbox input{width:100%;height:46px;margin-bottom:12px;}
  .loginbox .btn{width:100%;height:46px;font-size:var(--fs-md);}
  @media (max-width:560px){.searchrow{flex-direction:column;}.searchrow .btn{width:100%;}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";

  // ------------------------------------------------------------------ βοηθητικά
  var app = document.getElementById("app");
  var chatHistory = []; // τελευταία μηνύματα συζήτησης, για follow-up ερωτήσεις
  var wall = null; // ο πελάτης (τοίχος) για τον οποίο δουλεύει τώρα ο πράκτορας (μόνο στο call center, όταν ανήκει σε περισσότερους από έναν)
  var WALL_KEY = "idmon-team-wall";
  var wallRequired = false; // true όταν ο πράκτορας ανήκει σε περισσότερους από έναν πελάτες: χωρίς επιλογή δεν φαίνονται έγγραφα ούτε γίνεται ερώτηση

  // Ο βοηθός γράφει συχνά markdown (**έντονα**, λίστες με * ή -). Εμφανίζεται ως κείμενο με έντονα και κουκκίδες,
  // χωρίς ποτέ innerHTML: κάθε κομμάτι μπαίνει με textContent.
  function renderRich(node, text) {
    while (node.firstChild) node.removeChild(node.firstChild);
    String(text).split("\n").forEach(function (line, i) {
      if (i > 0) node.appendChild(document.createElement("br"));
      line = line.replace(/^\s*[*-]\s+/, "• ");
      line.split(/\*\*([^*]+)\*\*/).forEach(function (part, k) {
        if (!part) return;
        if (k % 2 === 1) { var b = document.createElement("strong"); b.textContent = part; node.appendChild(b); }
        else node.appendChild(document.createTextNode(part));
      });
    });
  }
  // Αναφορά προς τον υπεύθυνο του τμήματος: "η απάντηση είναι λάθος / ξεπερασμένη". Δεν στέλνεται ταυτότητα, μόνο το
  // έγγραφο-πηγή, το είδος και η ερώτηση.
  function feedbackRow(documentId, question) {
    var row = h("div", { class: "feedback", style: "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:var(--fs-sm);color:var(--text-soft);" });
    function send(kind) {
      fetch("/team/feedback", {
        method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ documentId: documentId, kind: kind, question: String(question).slice(0, 300) }),
      }).then(function (r) {
        row.textContent = r.status === 201 ? "Ευχαριστούμε. Ενημερώθηκε ο υπεύθυνος του τμήματος."
          : r.status === 429 ? "Έχεις στείλει πολλές αναφορές σήμερα." : "Δεν στάλθηκε. Δοκίμασε ξανά.";
      }).catch(function () { row.textContent = "Δεν στάλθηκε. Δοκίμασε ξανά."; });
    }
    row.appendChild(h("span", { text: "Ήταν σωστή η απάντηση;" }));
    row.appendChild(h("button", { class: "btn secondary", type: "button", text: "Είναι λάθος", onclick: function () { send("wrong"); } }));
    row.appendChild(h("button", { class: "btn secondary", type: "button", text: "Είναι ξεπερασμένη", onclick: function () { send("outdated"); } }));
    return row;
  }
  function h(tag, props, children) {
    var node = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      if (k === "class") node.className = props[k];
      else if (k === "text") node.textContent = props[k];
      else if (k.slice(0, 2) === "on") node.addEventListener(k.slice(2), props[k]);
      else node.setAttribute(k, props[k]);
    });
    (children || []).forEach(function (c) {
      if (c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  function api(path, method, body) {
    var opts = { method: method || "GET", headers: {}, credentials: "same-origin" };
    if (body !== undefined) {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    return fetch(path, opts).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        return { status: res.status, data: data };
      });
    });
  }

  // ==== ΜΕΝΟΥ ΧΡΗΣΤΗ ΚΑΙ ΚΥΚΛΑΚΙ ΑΡΙΘΜΟΥ: ΚΟΙΝΟ ΣΤΙΣ ΤΡΕΙΣ ΣΕΛΙΔΕΣ (portal, team-editor, team-admin) ====
  // Πρέπει να είναι ΙΔΙΟ αυτολεξεί και στις τρεις: το ελέγχει το τεστ της ενότητας 32. Αν το αλλάξεις, άλλαξέ το και στις τρεις.
  var USER_ROLE_NAME = { admin: "Διαχειριστής", editor: "Συντάκτης", employee: "Υπάλληλος" };
  function menuInitials(email) {
    var name = String(email || "").split("@")[0].replace(/[^A-Za-zΑ-Ωα-ωΆ-Ώά-ώ]+/g, " ").trim();
    var parts = name.split(/\s+/);
    return ((parts[0] || "?").charAt(0) + (parts[1] ? parts[1].charAt(0) : "")).toUpperCase();
  }
  // Κυκλάκι με αριθμό: δεν υπάρχει όταν δεν υπάρχει τίποτα νέο, δείχνει «99+» πάνω από 99. Είναι διακοσμητικό (aria-hidden):
  // ο αριθμός λέγεται από το aria-label του κουμπιού (countLabel).
  function countBadge(n) {
    n = Number(n);
    if (!isFinite(n) || n < 1) return null;
    return h("span", { class: "count-badge", "aria-hidden": "true", text: n > 99 ? "99+" : String(Math.floor(n)) });
  }
  function countLabel(n) {
    n = Math.floor(Number(n));
    return n > 99 ? "πάνω από 99 νέα" : n === 1 ? "1 νέο" : n + " νέα";
  }
  // Μενού λογαριασμού: κουμπί με τα αρχικά (τέρμα δεξιά, τελευταίο στη σειρά) που ανοίγει μικρό μενού με το email, τον ρόλο και το «Έξοδος».
  // Κλείνει με Esc, με κλικ έξω ή όταν φεύγεις με Tab. Οι ακροατές εγγράφου μπαίνουν ΜΟΝΟ όσο το μενού είναι ανοιχτό.
  function userMenu(me, onLogout) {
    var isOpen = false;
    var wrap = h("div", { class: "user-menu-wrap" });
    var btn = h("button", { class: "avatar-btn", type: "button", id: "user-menu-btn", "aria-haspopup": "menu", "aria-expanded": "false",
      "aria-controls": "user-menu", "aria-label": "Ο λογαριασμός μου (" + (me.email || "") + ")", text: menuInitials(me.email),
      onclick: function () { setOpen(!isOpen, false); } });
    var logout = h("button", { class: "btn secondary um-item", type: "button", role: "menuitem", id: "logout", text: "Έξοδος",
      onclick: function () { setOpen(false, false); api("/team/logout", "POST").then(onLogout); } });
    var panel = h("div", { class: "user-menu", id: "user-menu", role: "menu", "aria-label": "Λογαριασμός" }, [
      h("div", { class: "um-head" }, [
        h("div", { class: "um-email", text: me.email || "" }),
        h("div", { class: "um-meta", text: (USER_ROLE_NAME[me.role] || "") + (me.workspaceName ? " · " + me.workspaceName : "") }),
      ]),
      logout,
    ]);
    panel.hidden = true;
    function onDocClick(e) { if (!wrap.contains(e.target)) setOpen(false, false); }
    function onKey(e) {
      if (e.key === "Escape") { e.preventDefault(); setOpen(false, true); }
      else if (e.key === "Tab") setOpen(false, false);
    }
    function setOpen(next, returnFocus) {
      isOpen = next;
      panel.hidden = !next;
      btn.setAttribute("aria-expanded", next ? "true" : "false");
      if (next) {
        document.addEventListener("click", onDocClick, true);
        document.addEventListener("keydown", onKey, true);
        logout.focus();
      } else {
        document.removeEventListener("click", onDocClick, true);
        document.removeEventListener("keydown", onKey, true);
        if (returnFocus) btn.focus();
      }
    }
    wrap.appendChild(btn);
    wrap.appendChild(panel);
    return wrap;
  }
  // ==== ΤΕΛΟΣ ΚΟΙΝΟΥ ΜΠΛΟΚ ====

  function daysAgo(iso) {
    var d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
    return d < 0 ? 0 : d;
  }
  function agoText(iso) {
    var d = daysAgo(iso);
    if (d === 0) return "σήμερα";
    if (d === 1) return "χθες";
    return "πριν " + d + " ημ.";
  }

  // ------------------------------------------------------------------ οθόνη σύνδεσης
  function renderLogin(message, kind) {
    clear(app);
    var email = h("input", { type: "email", id: "email", autocomplete: "email", placeholder: "το email σου στην εταιρεία", "aria-label": "Email", required: "required" });
    var note = h("p", { class: "note" + (kind ? " " + kind : ""), role: "status", "aria-live": "polite", text: message || "" });
    var btn = h("button", { class: "btn", type: "submit", text: "Στείλε μου σύνδεσμο" });
    var form = h("form", { onsubmit: function (e) {
      e.preventDefault();
      btn.disabled = true;
      api("/team/login/start", "POST", { email: email.value }).then(function (r) {
        btn.disabled = false;
        if (r.status === 200) {
          note.className = "note ok";
          note.textContent = "Αν το email ανήκει σε εταιρεία, θα λάβεις σε λίγο έναν σύνδεσμο. Ισχύει για 15 λεπτά και ανοίγει μία φορά.";
        } else if (r.status === 429) {
          note.className = "note err";
          note.textContent = "Πολλές προσπάθειες. Δοκίμασε ξανά σε λίγα λεπτά.";
        } else {
          note.className = "note err";
          note.textContent = "Έλεγξε ότι το email είναι σωστά γραμμένο.";
        }
      }).catch(function () {
        btn.disabled = false;
        note.className = "note err";
        note.textContent = "Δεν ήταν δυνατή η αποστολή. Δοκίμασε ξανά.";
      });
    } }, [email, btn]);
    app.appendChild(h("div", { class: "loginbox card" }, [
      h("h1", { text: "Σύνδεση" }),
      h("p", { text: "Γράψε το email που έχεις στην εταιρεία και θα σου στείλουμε έναν σύνδεσμο. Δεν χρειάζεσαι κωδικό." }),
      form, note,
    ]));
    email.focus();
  }

  // ------------------------------------------------------------------ κύρια οθόνη
  function renderApp(me) {
    clear(app);
    var deptPills = (me.departments || []).map(function (d) { return h("span", { class: "pill", text: d.name }); });
    var rolePill = h("span", { class: "pill muted", text: USER_ROLE_NAME[me.role] || me.role });
    var manage = me.role === "employee" ? null : h("a", { href: "/team-editor.html", id: "staff-link", class: "btn secondary", text: "Εισερχόμενα και έγγραφα" });
    var adminLink = me.role === "admin" ? h("a", { href: "/team-admin.html", id: "admin-link", class: "btn secondary", text: "Διαχείριση" }) : null;
    if (manage) {
      api("/team/inbox").then(function (r) {
        if (r.status !== 200) return;
        var c = r.data.counts, total = c.contradictions + c.updates + c.questions;
        var badge = countBadge(total);
        if (badge) { manage.appendChild(badge); manage.setAttribute("aria-label", "Εισερχόμενα και έγγραφα, " + countLabel(total)); }
      });
    }

    app.appendChild(h("div", { class: "topbar" }, [
      h("div", { class: "brand" }, [h("span", { text: me.workspaceName || "Idmon" })].concat(deptPills, [rolePill])),
      h("div", { class: "userbox topnav" }, [manage, adminLink, userMenu(me, function () { chatHistory = []; renderLogin(); })]),
    ]));

    var input = h("input", { type: "text", id: "q", placeholder: "Ρώτα για μια διαδικασία…", "aria-label": "Ερώτηση", autocomplete: "off", maxlength: "1000" });
    var ask = h("button", { class: "btn lg", type: "submit", text: "Ρώτα" });
    var answerBox = h("div", { class: "answer card", style: "display:none;", "aria-live": "polite" });
    var recent = h("div", null, [h("h2", { text: "Τι άλλαξε πρόσφατα" })]);
    var docsCol = h("div", null, [h("h2", { text: "Έγγραφα που βλέπεις" })]);

    // Επιλογή πελάτη (call center, μέλος σε περισσότερους από έναν πελάτες). Χωρίς επιλογή δεν γίνεται ερώτηση: αλλιώς η απάντηση θα έβγαινε ανάμεικτη.
    wall = null;
    var walls = me.profile === "multi_client" && me.walls && me.walls.length > 1 ? me.walls : null;
    wallRequired = !!walls;
    if (walls) {
      var stored = null;
      try { stored = window.localStorage.getItem(WALL_KEY); } catch (e) { stored = null; }
      var pick = h("select", { id: "wall", "aria-label": "Πελάτης για τον οποίο δουλεύεις" }, [h("option", { value: "", text: "Διάλεξε πελάτη…" })].concat(walls.map(function (w) { return h("option", { value: w.id, text: w.name }); })));
      if (stored && walls.some(function (w) { return w.id === stored; })) { pick.value = stored; wall = stored; }
      var wallNote = h("span", { class: "note", id: "wall-note", role: "status" });
      var setWall = function (value, fromUser) {
        wall = value || null;
        try { if (wall) window.localStorage.setItem(WALL_KEY, wall); else window.localStorage.removeItem(WALL_KEY); } catch (e) { /* ignore */ }
        input.placeholder = wall ? "Ρώτα για μια διαδικασία…" : "Διάλεξε πρώτα πελάτη…";
        ask.disabled = !wall;
        if (fromUser) {
          // Άλλος πελάτης = άλλη συζήτηση: καθαρίζουμε την απάντηση και το ιστορικό, ώστε τίποτα να μη περάσει από τον έναν πελάτη στον άλλον.
          chatHistory = [];
          clear(answerBox); answerBox.style.display = "none";
          wallNote.textContent = "";
          loadDocuments(me, recent, docsCol);
        }
      };
      pick.addEventListener("change", function () { setWall(pick.value, true); });
      app.appendChild(h("div", { class: "wallrow", id: "wallrow" }, [h("label", { for: "wall", text: "Δουλεύεις για:" }), pick, wallNote]));
      setWall(pick.value, false);
    }
    app.appendChild(h("form", { class: "searchrow", onsubmit: function (e) { e.preventDefault(); askQuestion(input, ask, answerBox); } }, [input, ask]));
    // Ο βοηθός είναι σύστημα AI και το δηλώνουμε καθαρά (άρθρο 50 του AI Act, σε ισχύ από 2 Αυγούστου 2026).
    app.appendChild(h("p", { class: "hint ai-note", id: "ai-note", text: "Ο βοηθός είναι AI. Απαντά μόνο από έγγραφα που έχεις πρόσβαση και μπορεί να κάνει λάθη: έλεγξε την πηγή." }));
    app.appendChild(answerBox);

    app.appendChild(h("div", { class: "cols" }, [recent, docsCol]));
    input.focus();
    loadDocuments(me, recent, docsCol);
  }

  function loadDocuments(me, recentCol, docsCol) {
    // Πράκτορας σε περισσότερους από έναν πελάτες, χωρίς επιλογή: δεν δείχνουμε έγγραφα κανενός (ούτε τίτλους άλλου πελάτη δίπλα σε αυτόν που εξυπηρετεί).
    if (wallRequired && !wall) {
      while (recentCol.childNodes.length > 1) recentCol.removeChild(recentCol.lastChild);
      while (docsCol.childNodes.length > 1) docsCol.removeChild(docsCol.lastChild);
      [recentCol, docsCol].forEach(function (col) { col.appendChild(h("div", { class: "empty wall-hint", text: "Διάλεξε πρώτα για ποιον πελάτη δουλεύεις." })); });
      return;
    }
    api("/team/documents" + (wall ? "?clientId=" + encodeURIComponent(wall) : "")).then(function (r) {
      // Ξαναφορτώνεται και όταν αλλάζει ο πελάτης: πρώτα καθαρίζουμε τις λίστες (κρατάμε μόνο τον τίτλο της στήλης).
      while (recentCol.childNodes.length > 1) recentCol.removeChild(recentCol.lastChild);
      while (docsCol.childNodes.length > 1) docsCol.removeChild(docsCol.lastChild);
      var docs = (r.data && r.data.documents) || [];
      // Ο υπάλληλος βλέπει ήδη μόνο τα δικά του + εταιρικά. Ο editor/admin βλέπει και άλλα
      // τμήματα (μόνο ανάγνωση), οπότε τα ξεχωρίζουμε με την ετικέτα τμήματος.
      // Ένα έγγραφο με εκκρεμές update μπαίνει πάντα εδώ (ακόμα κι αν το βασικό κείμενο είναι παλιό),
      // γιατί είναι ακριβώς η πληροφορία που δεν θα έβρισκε κανείς αλλιώς.
      function lastChange(d) { return d.pendingUpdates ? d.pendingUpdates.latestAt : d.updatedAt; }
      var freshDocs = docs.filter(function (d) { return d.pendingUpdates || (d.updatedAt && daysAgo(d.updatedAt) <= 14); })
        .sort(function (a, b) { return String(lastChange(b)).localeCompare(String(lastChange(a))); }).slice(0, 6);
      if (!freshDocs.length) recentCol.appendChild(h("div", { class: "empty", text: "Καμία αλλαγή τις τελευταίες 14 ημέρες. Εδώ θα βλέπεις ποια έγγραφα άλλαξαν πρόσφατα." }));
      freshDocs.forEach(function (d) {
        var label = d.pendingUpdates ? "συμπλήρωμα " + agoText(d.pendingUpdates.latestAt) : "ενημερώθηκε " + agoText(d.updatedAt);
        recentCol.appendChild(h("a", { class: "row btn secondary listbtn", href: "/team-article.html?id=" + encodeURIComponent(d.id) }, [
          h("span", { class: "title", text: d.title }),
          h("span", { class: "badge", text: label }),
        ]));
      });
      if (!docs.length) {
        // Άδεια οθόνη = οδηγός: τι είναι, γιατί είναι άδεια, τι να κάνεις (ο συντάκτης και ο διαχειριστής έχουν κουμπί, ο υπάλληλος εξήγηση).
        var emptyBox = h("div", { class: "empty emptybox", id: "docs-empty" }, [h("p", { text: me.role === "employee"
          ? "Δεν υπάρχουν έγγραφα ακόμα. Όταν ο υπεύθυνος του τμήματός σου ανεβάσει έγγραφα, θα εμφανιστούν εδώ και ο βοηθός θα μπορεί να απαντά από αυτά."
          : "Δεν υπάρχουν έγγραφα ακόμα. Ο βοηθός απαντά μόνο από τα έγγραφα που γράφεις, γι' αυτό ξεκίνα από ένα." })]);
        if (me.role !== "employee") emptyBox.appendChild(h("a", { href: "/team-editor.html", class: "btn", id: "first-doc", text: "Γράψε το πρώτο έγγραφο" }));
        docsCol.appendChild(emptyBox);
      }
      // "Κοινό": έγγραφο άλλου project που μοιράζεται με τα δικά σου (ο admin τα βλέπει όλα, άρα δεν χρειάζεται ετικέτα).
      var own = {}; (me.departments || []).forEach(function (x) { own[x.id] = true; });
      docs.forEach(function (d) {
        var shared = me.role !== "admin" && d.departmentId !== "_all" && !own[d.departmentId];
        docsCol.appendChild(h("a", { class: "row btn secondary listbtn", href: "/team-article.html?id=" + encodeURIComponent(d.id) }, [
          h("span", { class: "title", text: d.title }),
          h("span", { class: "meta" }, [h("span", { text: d.departmentName }), shared ? h("span", { class: "pill shared", text: "κοινό" }) : null]),
        ]));
      });
    });
  }

  // ------------------------------------------------------------------ ερώτηση προς τον βοηθό
  function askQuestion(input, ask, box) {
    var question = input.value.trim();
    if (!question) return;
    ask.disabled = true;
    clear(box);
    box.style.display = "";
    var body = h("p", { class: "body", text: "Ψάχνω…" });
    var wallName = wall ? (function () { var sel = document.getElementById("wall"); var o = sel && sel.options[sel.selectedIndex]; return o ? o.text : ""; })() : "";
    box.appendChild(h("p", { class: "label" }, [h("span", { class: "pill muted", text: "AI" }), h("span", { text: "Απάντηση από AI, με βάση τα έγγραφα που έχεις πρόσβαση" + (wallName ? " · πελάτης: " + wallName : "") })]));
    box.appendChild(body);
    var text = "";

    fetch("/team/query/stream", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(wall ? { question: question, history: chatHistory.slice(-6), clientId: wall } : { question: question, history: chatHistory.slice(-6) }),
    }).then(function (res) {
      // Ο server απαιτεί πελάτη (400) ή τον αρνείται (403): δεν ξαναδοκιμάζουμε σιωπηλά, ζητάμε από τον χρήστη να διαλέξει.
      if (res.status === 400 || res.status === 403) {
        return res.json().catch(function () { return {}; }).then(function (d) {
          var sel = document.getElementById("wall");
          if (d.error === "client_required") { body.textContent = "Διάλεξε πρώτα για ποιον πελάτη δουλεύεις."; if (sel) sel.focus(); return null; }
          if (d.error === "client_forbidden") {
            body.textContent = "Ο πελάτης που διάλεξες δεν είναι διαθέσιμος για σένα. Διάλεξε άλλον.";
            try { window.localStorage.removeItem(WALL_KEY); } catch (e) { /* ignore */ }
            if (sel) { sel.value = ""; sel.dispatchEvent(new Event("change")); }
            return null;
          }
          throw new Error("bad response");
        });
      }
      if (res.status === 429) { body.textContent = "Έφτασες το ημερήσιο όριο ερωτήσεων. Δοκίμασε αύριο ή ρώτα τον υπεύθυνο του τμήματός σου."; return null; }
      if (res.status === 401) { renderLogin("Η σύνδεσή σου έληξε. Ζήτησε νέο σύνδεσμο.", "err"); return null; }
      if (!res.ok || !res.body) throw new Error("bad response");
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";
      function pump() {
        return reader.read().then(function (chunk) {
          if (chunk.done) return;
          buffer += decoder.decode(chunk.value, { stream: true });
          var idx;
          while ((idx = buffer.indexOf("\n\n")) !== -1) {
            var line = buffer.slice(0, idx).trim();
            buffer = buffer.slice(idx + 2);
            if (line.indexOf("data:") !== 0) continue;
            var ev;
            try { ev = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
            handleEvent(ev);
          }
          return pump();
        });
      }
      function handleEvent(ev) {
        if (ev.type === "chunk") { text += ev.text; renderRich(body, text); }
        else if (ev.type === "error") { body.textContent = "Κάτι πήγε στραβά. Δοκίμασε ξανά."; }
        else if (ev.type === "done") {
          if (ev.primarySource && !ev.isFallback) {
            var s = ev.primarySource;
            box.appendChild(h("div", { class: "source" }, [
              h("span", { text: "Πηγή: " + (s.title || "έγγραφο") + " · " + s.departmentName + (s.isUpdate ? " (πρόσφατη ενημέρωση)" : "") }),
              h("a", { class: "btn secondary", href: "/team-article.html?id=" + encodeURIComponent(s.documentId), text: "Άνοιγμα άρθρου" }),
            ]));
            box.appendChild(feedbackRow(s.documentId, question));
          }
          box.appendChild(h("p", { class: "handoff", text: "Δεν βρήκες αυτό που έψαχνες; Ρώτα τον υπεύθυνο του τμήματος." }));
          chatHistory.push({ role: "user", text: question }, { role: "assistant", text: text });
        }
      }
      return pump();
    }).catch(function () {
      body.textContent = "Δεν ήταν δυνατή η αναζήτηση. Δοκίμασε ξανά.";
    }).then(function () { ask.disabled = false; });
  }

  // ------------------------------------------------------------------ εκκίνηση
  function verifyToken(token) {
    return api("/team/login/verify", "POST", { token: token }).then(function (r) {
      // Καθαρίζουμε το token από τη γραμμή διευθύνσεων, ό,τι κι αν έγινε.
      clearFragment();
      if (r.status === 200) return boot();
      renderLogin("Ο σύνδεσμος έληξε ή έχει ήδη χρησιμοποιηθεί. Ζήτησε νέο.", "err");
    });
  }
  function clearFragment() {
    try { window.history.replaceState(null, "", window.location.pathname + window.location.search); } catch (e) { /* ignore */ }
  }
  function boot() {
    return api("/team/me").then(function (r) {
      if (r.status === 200) renderApp(r.data); else renderLogin();
    }).catch(function () { renderLogin("Δεν ήταν δυνατή η σύνδεση με τον server.", "err"); });
  }

  var m = /^#login=([a-f0-9]{64})$/.exec(window.location.hash || "");
  if (m) verifyToken(m[1]); else boot();
})();
</script>
</body>
</html>
